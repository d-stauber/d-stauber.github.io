  /* ──────────────────────────────────────────────────────────────
     MAIN RENDER
     ────────────────────────────────────────────────────────────── */
  function render() {
    /* No game yet → start screen + maybe rules */
    if (!game) {
      $app.innerHTML = `
        ${showStart  ? startScreen() : ''}
        ${showRules  ? rulesModal() : ''}
      `;
      return;
    }

    const p = curPlayer();
    const banner = statusBanner();

    $app.innerHTML = `
      <div class="app">

        <!-- LEFT RAIL : title, players, legend -->
        <div class="panel">
          <div class="header">
            <div class="h-eyebrow">A strategy game</div>
            <div class="h-title">Tolerance</div>
            <div class="h-sub">An autoimmunity game inspired by Catan.</div>
          </div>
          <div class="body stack">
            <div class="row">
              <button class="btn small ghost" onclick="G.showRules()">How to play</button>
              <button class="btn small ghost" onclick="G.restart()">New game</button>
            </div>

            <div>
              <div class="h-eyebrow" style="color:var(--ink-faint); margin-bottom:8px">Players \u00b7 first to ${VICTORY_TARGET} VP</div>
              <div class="stack" style="gap:8px">${renderPlayerCards()}</div>
            </div>

            ${renderLegend()}

            <div class="card">
              <strong>Bank</strong>
              <div class="resource-row" style="margin-top:8px">
                ${RESOURCES.map(r => `
                  <div class="res-tile ${r.key}">
                    <div class="count mono-num">${game.bank[r.key]}</div>
                    <div class="label">${r.short}</div>
                  </div>`).join('')}
              </div>
              <div class="tiny" style="margin-top:6px">${game.deck.length} therapy ${game.deck.length === 1 ? 'card' : 'cards'} left in deck</div>
            </div>

          </div>
          <div class="footer-note">
            Win = manage, not cure. Reaching ${VICTORY_TARGET} VP represents stable, durable disease control \u2014
            the realistic goal of modern autoimmune medicine.
          </div>
        </div>

        <!-- CENTER : board -->
        <div class="panel board-panel">
          <div class="topbar">
            <div>
              <div class="h-eyebrow">Turn ${game.turn} \u00b7 ${isSetup() ? 'setup' : (game.rolled ? 'in play' : 'to roll')}</div>
              <div class="h-title small">${escText(banner.lead)}</div>
            </div>
            <div class="row">
              ${renderDice()}
              <button class="btn primary"
                      ${(isSetup() || game.rolled || game.winner !== null || game.moveFlareRequired) ? 'disabled' : ''}
                      onclick="G.rollDice()">Roll Dice</button>
              <button class="btn"
                      ${(isSetup() || !game.rolled || game.moveFlareRequired || game.winner !== null
                          || game.pendingAction !== null) ? 'disabled' : ''}
                      onclick="G.endTurn()">End Turn</button>
            </div>
          </div>
          <div class="${banner.cls}">
            <div class="lead">${escText(banner.lead)}</div>
            <div class="desc">${escText(banner.desc)}</div>
          </div>
          <div class="board-wrap">${renderBoard()}</div>
        </div>

        <!-- RIGHT RAIL : current player -->
        <div class="panel">
          <div class="header">
            <div class="h-eyebrow">Active player</div>
            <div class="between">
              <div class="row">
                <span class="swatch" style="background:${p.colorHex}; width:16px; height:16px; border-radius:3px; display:inline-block; border:1px solid rgba(0,0,0,0.15)"></span>
                <strong style="font-size:18px">${escText((isSetup() ? activePlayer() : p).name)}</strong>
              </div>
              <span class="pill mono-num">${publicVp(isSetup() ? activePlayer() : p)} VP</span>
            </div>
          </div>
          <div class="body stack">
            <div>
              <div class="h-eyebrow" style="color:var(--ink-faint); margin-bottom:8px">Your resources</div>
              <div class="resource-row">${renderResources(isSetup() ? activePlayer() : p)}</div>
            </div>

            ${renderActionPanel()}

            ${(!isSetup() && !game.moveFlareRequired && game.pendingAction !== 'discard') ? `
              <div>
                <div class="h-eyebrow" style="color:var(--ink-faint); margin-bottom:8px">Your therapy hand</div>
                ${renderHand()}
              </div>
              ${renderTrade()}
            ` : ''}

            <div class="card">
              <div class="h-eyebrow" style="color:var(--ink-faint); margin-bottom:6px">Tile inspector</div>
              ${renderTileInspect()}
            </div>

            <div>
              <div class="h-eyebrow" style="color:var(--ink-faint); margin-bottom:8px">Event log</div>
              <div class="log">
                ${game.log.map(item => {
                  const isEdu = String(item).startsWith('EDU:');
                  const text = isEdu ? String(item).slice(4) : item;
                  return `<div class="log-item ${isEdu ? 'edu' : ''}">${escText(text)}</div>`;
                }).join('')}
              </div>
            </div>
          </div>
        </div>

      </div>

      ${showSummary && game.winner !== null ? endgameModal() : ''}
      ${showRules ? rulesModal() : ''}
    `;
  }

  /* ──────────────────────────────────────────────────────────────
     MODALS
     ────────────────────────────────────────────────────────────── */
  function startScreen() {
    return `
      <div class="title-screen">
        <div class="title-card">
          <div class="eyebrow">A strategy game about autoimmunity</div>
          <h1 class="logo">Tolerance.</h1>
          <p class="tagline">Build clinics, manage flares, and guide a misdirected immune system back toward self-tolerance.</p>
          <div class="divider"></div>
          <div class="blurb">
            <p><strong>Autoimmunity</strong> is misdirected immunity \u2014 the immune system attacking healthy tissue because tolerance has failed. In this game you collect immune insight from real disease sites and build a care-and-research network to restore balance.</p>
            <p>The board features <strong>nine disease sites</strong> \u2014 Joint, Skin, Gut, CNS, Pancreas, Kidney, Eye, Lymph Node, and Bone Marrow \u2014 each one a real teaching anchor. Therapy cards represent real drug mechanisms.</p>
          </div>
          <div class="start-grid">
            <div class="start-card">
              <strong>Players</strong>
              <div class="player-buttons">
                ${[2,3,4].map(n => `
                  <button class="warm-btn ${startConfig.count === n ? 'active' : ''}" onclick="G.setCount(${n})">${n} players</button>
                `).join('')}
              </div>
            </div>
            <div class="start-card">
              <strong>Core loop</strong>
              <div class="tiny" style="margin-top:8px">Roll \u2192 collect \u2192 build clinics &amp; pathways \u2192 play therapies \u2192 reach ${VICTORY_TARGET} VP.</div>
            </div>
          </div>
          <div class="start-card" style="margin-top:14px">
            <strong>Player names</strong>
            <div class="name-grid">
              ${Array.from({length: startConfig.count}, (_, i) => `
                <input class="warm-input" value="${escAttr(startConfig.names[i] || DEFAULT_NAMES[i])}"
                       oninput="G.setName(${i}, this.value)" />
              `).join('')}
            </div>
          </div>
          <div class="start-actions">
            <button class="warm-btn primary" onclick="G.startGame()">Begin \u2192</button>
            <button class="warm-btn" onclick="G.showRules()">How to play</button>
          </div>
        </div>
      </div>`;
  }

  function rulesModal() {
    return `
      <div class="modal-wrap" onclick="G.tryCloseRules(event)">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="header between">
            <div>
              <div class="h-eyebrow">Rules</div>
              <div class="h-title small">How to play Tolerance</div>
            </div>
            <button class="btn small" onclick="G.hideRules()">Close</button>
          </div>
          <div class="content stack">
            <div class="card">
              <strong>Goal</strong>
              <div class="tiny" style="margin-top:6px;line-height:1.55">
                Be the first to reach <strong>${VICTORY_TARGET} victory points</strong>.
                Clinic = 1 VP \u00b7 Research center = 2 VP \u00b7
                Strongest Pathway Network (5+ longest) = 2 VP \u00b7
                Most Comprehensive Care (3+ therapies played) = 2 VP \u00b7
                Each Precision Breakthrough = 1 hidden VP.
              </div>
            </div>

            <div class="modal-grid">
              <div class="card">
                <strong>Setup</strong>
                <div class="tiny" style="margin-top:6px;line-height:1.55">
                  Each player places <strong>2 clinics + 2 pathways</strong> in snake order
                  (1\u2192N, then N\u21921). Your second clinic gives you the resources of every tile it touches.
                </div>
              </div>
              <div class="card">
                <strong>The board</strong>
                <div class="tiny" style="margin-top:6px;line-height:1.55">
                  19 hexes representing real autoimmune disease sites. Each tile produces one resource type.
                  The neutral <em>Trigger</em> tile produces nothing and is where the flare starts.
                </div>
              </div>
            </div>

            <div class="modal-grid">
              <div class="card">
                <strong>Your turn</strong>
                <div class="tiny" style="margin-top:6px;line-height:1.55">
                  1. <strong>Roll</strong> two dice.<br>
                  2. Tiles showing that number produce resources to anyone with a clinic touching them
                     (clinic = 1, research center = 2). The flared tile produces nothing.<br>
                  3. <strong>Build, trade, buy or play</strong> a therapy. Order is yours.<br>
                  4. <strong>End turn</strong>.
                </div>
              </div>
              <div class="card">
                <strong>Rolling a 7 (Flare!)</strong>
                <div class="tiny" style="margin-top:6px;line-height:1.55">
                  Each player holding more than 7 resources discards half (you choose which).
                  Then move the flare to any tile and steal one resource from a player whose clinic borders it.
                </div>
              </div>
            </div>

            <div class="card">
              <strong>Build costs</strong>
              <div class="tiny" style="margin-top:8px;line-height:1.7">
                <div>Pathway: ${costChips(COSTS.pathway)}</div>
                <div style="margin-top:4px">Clinic: ${costChips(COSTS.clinic)} (must connect to your pathway, not adjacent to any clinic)</div>
                <div style="margin-top:4px">Research center: ${costChips(COSTS.research)} (upgrades a clinic)</div>
                <div style="margin-top:4px">Therapy card: ${costChips(COSTS.therapy)}</div>
              </div>
            </div>

            <div class="card">
              <strong>Therapy cards</strong>
              <div class="tiny" style="margin-top:6px;line-height:1.55">
                Each card represents a real-world treatment mechanism.
                You can\u2019t play a card the turn you drew it (1-turn delay).
                You may play one card per turn (Precision Breakthrough is automatic).
              </div>
              <ul class="tiny" style="margin:8px 0 0 18px;line-height:1.55">
                <li><strong>Anti-Cytokine Therapy</strong> \u2014 move the flare; steal one resource. Stands in for TNF / IL-6 / IL-17 blockade.</li>
                <li><strong>Low-Dose IL-2 / Treg Boost</strong> \u2022 <strong>Tolerogenic APC Reset</strong> \u2014 take any 2 resources from the bank.</li>
                <li><strong>B-Cell Depletion</strong> \u2022 <strong>Plasmapheresis</strong> \u2014 collect a chosen resource type from every opponent.</li>
                <li><strong>Costimulation Blockade</strong> \u2022 <strong>JAK Inhibition</strong> \u2014 build 2 free pathways.</li>
                <li><strong>Precision Breakthrough</strong> \u2014 1 hidden VP each.</li>
              </ul>
            </div>

            <div class="card">
              <strong>Two themes worth noting</strong>
              <div class="tiny" style="margin-top:6px;line-height:1.55">
                <em>Tolerance, not cure.</em> You win when the immune system is durably stable, not when disease is erased.<br>
                <em>Breadth wins.</em> "Most Comprehensive Care" rewards using a variety of therapy mechanisms \u2014 a soft nudge toward the way real autoimmune medicine is moving.
              </div>
            </div>
          </div>
        </div>
      </div>`;
  }

  function endgameModal() {
    const w = game.players[game.winner];
    const finalVps = game.players.map(p => ({
      p,
      total: victoryPoints(p),
      lines: [
        `${p.clinics.length} clinic${p.clinics.length !== 1 ? 's' : ''}: ${p.clinics.length}`,
        `${p.research.length} research \u00d7 2: ${p.research.length * 2}`,
        p.hasLongest ? 'Strongest Pathway: 2' : null,
        game.mostTherapyOwner === p.id ? 'Most Comprehensive Care: 2' : null,
        p.hiddenVp ? `${p.hiddenVp} Precision Breakthrough: ${p.hiddenVp}` : null
      ].filter(Boolean)
    })).sort((a, b) => b.total - a.total);

    return `
      <div class="modal-wrap">
        <div class="modal">
          <div class="header">
            <div class="h-eyebrow">Game over</div>
            <div class="h-title">${escText(w.name)} reached tolerance.</div>
            <div class="h-sub">${VICTORY_TARGET} VP \u2014 stable, durable disease control.</div>
          </div>
          <div class="content stack">
            ${finalVps.map((row, i) => `
              <div class="card ${i === 0 ? 'focus' : ''}">
                <div class="between">
                  <div class="row">
                    <span class="swatch" style="background:${row.p.colorHex}; width:12px; height:12px; border-radius:3px; display:inline-block"></span>
                    <strong>${i === 0 ? '\u00b7 ' : ''}${escText(row.p.name)}</strong>
                  </div>
                  <span class="pill mono-num">${row.total} VP</span>
                </div>
                <div class="tiny" style="margin-top:6px;line-height:1.55">${row.lines.join(' \u00b7 ')}</div>
              </div>
            `).join('')}
            <div class="card">
              <em class="tiny" style="line-height:1.55">
                Modern autoimmune treatment is moving from broad immune suppression toward targeted, tolerance-restoring
                immune recalibration. The therapy cards in this deck are simplified, but the mechanisms are real.
              </em>
            </div>
            <div class="row">
              <button class="warm-btn primary" onclick="G.restart()">Play again</button>
              <button class="warm-btn" onclick="G.dismissSummary()">Review board</button>
            </div>
          </div>
        </div>
      </div>`;
  }

  /* ──────────────────────────────────────────────────────────────
     GLOBAL HOOK · used by inline onclick handlers
     ────────────────────────────────────────────────────────────── */
  window.G = {
    /* setup */
    setCount(n) {
      startConfig.count = n;
      while (startConfig.names.length < n) startConfig.names.push(DEFAULT_NAMES[startConfig.names.length]);
      render();
    },
    setName(i, v) { startConfig.names[i] = v; },
    startGame, restart,
    showRules() { showRules = true; render(); },
    hideRules() { showRules = false; render(); },
    tryCloseRules(ev) { if (ev.target.classList.contains('modal-wrap')) { showRules = false; render(); } },
    dismissSummary() { showSummary = false; render(); },

    /* play */
    rollDice, endTurn,
    setAction, cancelAction,
    clickTile, clickVertex, clickEdge,
    buyTherapy, selectCard,
    playSelected: playSelectedCard,
    resolvePlentyPick, resolveMonopolyPick,
    doSteal,
    discardNudge, confirmDiscard,
    setTrade, doTrade
  };

  render();
  })();
  </script>
</body>
</html>
