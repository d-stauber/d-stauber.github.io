<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tolerance — A Strategy Game About Autoimmunity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter+Tight:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /*  ────────────  TOKENS  ──────────── */
    :root {
      /* Paper palette */
      --paper:        #f4ede1;
      --paper-edge:   #ebe1d0;
      --card:         #faf6ec;
      --card-soft:    #f5efe0;
      --rule:         #d8cdb5;
      --rule-soft:    #e2d9c4;

      /* Ink */
      --ink:          #1d2330;
      --ink-soft:     #4a5466;
      --ink-faint:    #7d8597;

      /* Accents (warm, editorial) */
      --red:          #c2453a;
      --red-deep:     #9d352b;
      --teal:         #2f6b6b;
      --teal-deep:    #1f4f4f;
      --gold:         #b88a3e;
      --gold-deep:    #8d6727;
      --plum:         #6e3d6a;

      /* Resource colors  — warm, distinct, slightly muted for paper feel */
      --cy:    #b54e4a;   /* Cytokine: warm red — inflammation */
      --bc:    #c5853a;   /* B-Cell:    amber */
      --tc:    #4a6fa5;   /* T-Cell:    steel blue */
      --my:    #7c4f9c;   /* Myeloid:   plum */
      --tl:    #4a8a5e;   /* Tolerance: green */
      --trigger: #5b5048; /* Trigger:   neutral brown */

      /* Player colors — saturated, easy to distinguish on cream */
      --p1: #c2453a;   /* red    */
      --p2: #2f6b6b;   /* teal   */
      --p3: #b88a3e;   /* gold   */
      --p4: #6e3d6a;   /* plum   */

      --shadow-1: 0 2px 4px rgba(20,15,5,0.06), 0 6px 18px rgba(20,15,5,0.10);
      --shadow-2: 0 4px 10px rgba(20,15,5,0.08), 0 18px 50px rgba(20,15,5,0.18);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Inter Tight', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-feature-settings: "ss01", "ss02", "cv11";
      -webkit-font-smoothing: antialiased;
    }
    body {
      background:
        radial-gradient(circle at 12% 18%, rgba(110, 61, 106, 0.06), transparent 38%),
        radial-gradient(circle at 88% 82%, rgba(47,107,107,0.06), transparent 42%),
        linear-gradient(180deg, var(--paper) 0%, var(--paper-edge) 100%);
    }

    button, input, select { font: inherit; color: inherit; }

    .serif        { font-family: 'Fraunces', Georgia, serif; }
    .serif-italic { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 300; letter-spacing: -0.02em; }
    .mono-num     { font-variant-numeric: tabular-nums; }

    /*  ────────────  TITLE SCREEN  ──────────── */
    .title-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .title-card {
      width: min(980px, 100%);
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: clamp(28px, 5vw, 58px);
      box-shadow: var(--shadow-2);
      position: relative;
      overflow: hidden;
    }
    .title-card::before {
      content: ""; position: absolute; inset: 9px;
      border: 1px solid var(--rule-soft);
      pointer-events: none; border-radius: 3px;
    }
    .eyebrow {
      text-transform: uppercase; letter-spacing: 0.32em;
      font-size: 11px; color: var(--teal); font-weight: 800;
      margin-bottom: 14px;
    }
    .logo {
      font-family: 'Fraunces', Georgia, serif;
      font-style: italic; font-weight: 300;
      font-size: clamp(54px, 8.5vw, 92px);
      line-height: 0.95; letter-spacing: -0.055em;
      color: var(--ink); margin: 0;
    }
    .tagline {
      font-family: 'Fraunces', Georgia, serif; font-style: italic;
      font-size: clamp(18px, 2vw, 24px);
      color: var(--ink-soft); max-width: 720px;
      margin: 14px 0 22px; line-height: 1.35;
    }
    .divider {
      height: 1px; background: var(--rule);
      margin: 22px 0; position: relative;
    }
    .divider::after {
      content: ""; position: absolute;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--red);
      left: 50%; top: -4px; transform: translateX(-50%);
    }
    .blurb { display: grid; grid-template-columns: 1fr 1fr; gap: 22px;
             color: var(--ink-soft); line-height: 1.62; font-size: 15px; margin-bottom: 22px; }
    .blurb p { margin: 0; }
    .blurb strong { color: var(--ink); }

    .start-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .start-card { background: rgba(255,255,255,0.55); border: 1px solid var(--rule-soft);
                  border-radius: 6px; padding: 14px; }
    .start-card strong { color: var(--ink); }
    .start-card .tiny { color: var(--ink-soft); }

    .player-buttons { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .name-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-top: 10px; }

    .warm-btn {
      border: 1px solid var(--rule); background: transparent;
      color: var(--ink); border-radius: 4px;
      padding: 11px 14px; font-weight: 700; cursor: pointer;
      transition: background .15s ease, border-color .15s ease, color .15s ease;
    }
    .warm-btn:hover { background: rgba(0,0,0,0.04); }
    .warm-btn.active { background: var(--ink); color: var(--card); border-color: var(--ink); }
    .warm-btn.primary { background: var(--red); color: var(--card); border-color: var(--red); font-weight: 800; }
    .warm-btn.primary:hover { background: var(--red-deep); border-color: var(--red-deep); }
    .warm-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .warm-btn.small { padding: 7px 10px; font-size: 13px; }

    .warm-input {
      width: 100%; min-height: 42px;
      border-radius: 4px; border: 1px solid var(--rule);
      background: white; color: var(--ink);
      padding: 10px 12px;
      transition: border-color .15s ease;
    }
    .warm-input:focus { outline: none; border-color: var(--ink); }

    .start-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }

    @media (max-width: 780px) {
      .blurb, .start-grid, .name-grid { grid-template-columns: 1fr; }
    }

    /*  ────────────  GAME SHELL  ──────────── */
    .app {
      min-height: 100vh; padding: 14px;
      display: grid;
      grid-template-columns: 300px 1fr 360px;
      gap: 14px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 6px;
      box-shadow: var(--shadow-1);
      overflow: hidden;
      position: relative;
    }
    .panel::before {
      content: ""; position: absolute; inset: 6px;
      border: 1px solid var(--rule-soft);
      pointer-events: none; border-radius: 3px; z-index: 0;
    }
    .panel > * { position: relative; z-index: 1; }

    .panel .header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--rule-soft);
      background: rgba(0,0,0,0.015);
    }
    .panel .body { padding: 14px 18px; }

    .board-panel { display: grid; grid-template-rows: auto auto 1fr; min-height: calc(100vh - 28px); }

    /* type */
    .h-title  { font-family: 'Fraunces', Georgia, serif; font-style: italic;
                font-weight: 400; font-size: 26px; letter-spacing: -0.025em;
                color: var(--ink); }
    .h-title.small { font-size: 20px; }
    .h-eyebrow { text-transform: uppercase; letter-spacing: 0.28em;
                 font-size: 10px; color: var(--teal); font-weight: 800; margin-bottom: 4px; }
    .h-sub    { color: var(--ink-soft); font-size: 13px; line-height: 1.45; margin-top: 4px; }
    .tiny     { color: var(--ink-soft); font-size: 12px; line-height: 1.45; }

    /* helpers */
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .stack { display: grid; gap: 12px; }

    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      min-height: 26px; padding: 3px 10px; border-radius: 999px;
      border: 1px solid var(--rule); background: var(--card-soft);
      font-size: 12px; font-weight: 600; color: var(--ink);
    }
    .pill.red    { color: var(--red);  border-color: var(--red);   background: #fbe9e6; }
    .pill.teal   { color: var(--teal); border-color: var(--teal);  background: #e1ecec; }
    .pill.gold   { color: var(--gold-deep); border-color: var(--gold); background: #f3ead4; }
    .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

    /* card */
    .card {
      background: var(--card-soft);
      border: 1px solid var(--rule-soft);
      border-radius: 5px;
      padding: 12px 14px;
    }
    .card.focus { border-color: var(--teal); background: #ecf3f3;
                  box-shadow: inset 0 0 0 1px rgba(47,107,107,0.20); }
    .card.warn  { border-color: var(--red); background: #fbeae7;
                  box-shadow: inset 0 0 0 1px rgba(194,69,58,0.20); }

    /*  ────────────  BUTTONS  ──────────── */
    .btn {
      border: 1px solid var(--rule);
      background: var(--card);
      color: var(--ink);
      padding: 9px 12px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, transform .08s ease;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:hover:not(:disabled) { background: var(--card-soft); border-color: var(--ink-faint); }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn.primary { background: var(--ink); color: var(--card); border-color: var(--ink); }
    .btn.primary:hover:not(:disabled) { background: #2a3140; border-color: #2a3140; }
    .btn.go      { background: var(--teal); color: var(--card); border-color: var(--teal); }
    .btn.go:hover:not(:disabled)      { background: var(--teal-deep); border-color: var(--teal-deep); }
    .btn.danger  { background: var(--red); color: var(--card); border-color: var(--red); }
    .btn.danger:hover:not(:disabled)  { background: var(--red-deep); border-color: var(--red-deep); }
    .btn.gold    { background: var(--gold); color: var(--card); border-color: var(--gold); }
    .btn.gold:hover:not(:disabled)    { background: var(--gold-deep); border-color: var(--gold-deep); }
    .btn.ghost { background: transparent; }
    .btn.small { padding: 6px 9px; font-size: 12px; }
    .btn.full  { width: 100%; justify-content: center; }
    .btn.active{ outline: 2px solid var(--ink); outline-offset: 1px; }

    /*  ────────────  RESOURCES  ──────────── */
    .resource-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .res-tile {
      border: 1px solid var(--rule-soft);
      border-radius: 5px;
      padding: 8px 4px;
      text-align: center;
      background: var(--card);
      position: relative;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .res-tile.gain { animation: pop .5s ease; }
    @keyframes pop { 0%{transform:scale(1)} 30%{transform:scale(1.12); box-shadow:0 0 0 4px rgba(0,0,0,0.06)} 100%{transform:scale(1)} }
    .res-tile .glyph { width: 22px; height: 22px; margin: 0 auto 2px; }
    .res-tile .count { font-size: 18px; font-weight: 800; line-height: 1; }
    .res-tile .label { font-size: 10px; color: var(--ink-soft); margin-top: 2px;
                       text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
    .res-tile.cy  { background: #fbeae7; }
    .res-tile.bc  { background: #faecd1; }
    .res-tile.tc  { background: #e1eaf5; }
    .res-tile.my  { background: #ece1f0; }
    .res-tile.tl  { background: #e2efe6; }

    /*  ────────────  COST CHIPS  ──────────── */
    .cost-row { display: flex; gap: 4px; flex-wrap: wrap; }
    .cost-chip {
      display: inline-flex; align-items: center; gap: 3px;
      min-height: 22px; padding: 2px 6px;
      border-radius: 3px;
      font-size: 11px; font-weight: 800;
      border: 1px solid;
      font-variant-numeric: tabular-nums;
    }
    .cost-chip.cy { color: var(--cy); border-color: var(--cy); background: #fbeae7; }
    .cost-chip.bc { color: var(--bc); border-color: var(--bc); background: #faecd1; }
    .cost-chip.tc { color: var(--tc); border-color: var(--tc); background: #e1eaf5; }
    .cost-chip.my { color: var(--my); border-color: var(--my); background: #ece1f0; }
    .cost-chip.tl { color: var(--tl); border-color: var(--tl); background: #e2efe6; }

    /*  ────────────  PLAYER CARDS  ──────────── */
    .player-card {
      background: var(--card-soft);
      border: 1px solid var(--rule-soft);
      border-radius: 5px;
      padding: 10px 12px;
      position: relative;
    }
    .player-card.active {
      border-color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--ink);
      background: var(--card);
    }
    .player-card.active::before {
      content: "▸"; position: absolute; left: -14px; top: 11px;
      color: var(--ink); font-weight: 900;
    }
    .player-card .swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block;
                           border: 1px solid rgba(0,0,0,0.15); }
    .player-card .name { font-weight: 800; font-size: 14px; }
    .player-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 8px; }
    .stat {
      background: rgba(0,0,0,0.03); border: 1px solid var(--rule-soft);
      border-radius: 3px; padding: 5px 4px; text-align: center;
    }
    .stat .v { font-size: 14px; font-weight: 800; line-height: 1.1; }
    .stat .k { font-size: 9px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
    .player-card .badge {
      display: inline-block; font-size: 10px; padding: 2px 6px;
      border-radius: 999px; background: var(--gold);
      color: var(--card); font-weight: 800; margin-right: 4px;
      letter-spacing: 0.05em; text-transform: uppercase;
    }
    .player-card .badge.teal { background: var(--teal); }

    /*  ────────────  STATUS BANNER  ──────────── */
    .status {
      margin: 12px 16px 0;
      padding: 12px 14px;
      border: 1px solid var(--rule-soft);
      border-radius: 5px;
      background: var(--card-soft);
    }
    .status.act { border-color: var(--teal); background: #ecf3f3; }
    .status.req { border-color: var(--red); background: #fbeae7; }
    .status .lead { font-weight: 800; font-size: 14px; }
    .status .desc { font-size: 12px; color: var(--ink-soft); margin-top: 2px; line-height: 1.45; }

    .topbar { padding: 14px 18px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }

    /*  ────────────  BOARD  ──────────── */
    .board-wrap { padding: 8px 14px 14px; display: grid; place-items: center; }
    svg.board { width: 100%; max-width: 980px; height: auto; user-select: none; }
    .hex polygon { transition: filter .15s ease, stroke-width .15s ease; }
    .hex { cursor: pointer; }
    .hex:hover polygon { filter: brightness(1.04); }
    .hex.selected polygon { stroke: var(--ink) !important; stroke-width: 3 !important; }
    .hex.flare polygon { filter: saturate(0.4) brightness(0.92); }

    .num-token rect, .num-token circle {
      filter: drop-shadow(0 1px 1px rgba(0,0,0,0.20));
    }

    .edge-hit  { cursor: pointer; }
    .edge-line { transition: stroke .15s ease, stroke-width .15s ease; pointer-events: none; }
    .edge-line.valid { animation: edgePulse 1.6s ease-in-out infinite; }
    @keyframes edgePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

    .vert-hit { cursor: pointer; }
    .vert-target { animation: vertPulse 1.4s ease-in-out infinite; }
    @keyframes vertPulse {
      0%, 100% { r: 7; }
      50% { r: 9.5; }
    }

    /* dice */
    .dice-area {
      display: inline-flex; gap: 6px; padding: 4px 10px 4px 6px;
      align-items: center;
      background: var(--card-soft); border: 1px solid var(--rule-soft);
      border-radius: 4px;
    }
    .die {
      width: 30px; height: 30px;
      background: var(--card); border: 1px solid var(--rule);
      border-radius: 5px;
      display: inline-grid; place-items: center;
      font-weight: 800; color: var(--ink);
      font-variant-numeric: tabular-nums;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.06);
    }
    .die.rolling { animation: rollDie 0.55s ease-out; }
    @keyframes rollDie {
      0%   { transform: rotate(0deg)  translateY(-4px); }
      30%  { transform: rotate(180deg) translateY(0); }
      60%  { transform: rotate(330deg) translateY(-2px); }
      100% { transform: rotate(360deg) translateY(0); }
    }

    /*  ────────────  HAND / THERAPY CARDS  ──────────── */
    .therapy-list { display: grid; gap: 8px; }
    .therapy {
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 5px;
      padding: 10px 12px;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease;
    }
    .therapy:hover { border-color: var(--ink-faint); }
    .therapy.selected { border-color: var(--ink); background: var(--card-soft);
                         box-shadow: inset 0 0 0 1px var(--ink); }
    .therapy.fresh { opacity: 0.55; cursor: not-allowed; }
    .therapy .title-row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .therapy .name { font-weight: 800; font-size: 13px; }
    .therapy .kind { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
                     color: var(--ink-soft); font-weight: 700; }
    .therapy .desc { font-size: 12px; color: var(--ink-soft); margin-top: 4px; line-height: 1.45; }

    /*  ────────────  EVENT LOG  ──────────── */
    .log {
      max-height: 240px; overflow: auto;
      display: grid; gap: 6px;
      padding-right: 4px;
    }
    .log-item {
      background: var(--card);
      border: 1px solid var(--rule-soft);
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 12.5px; line-height: 1.45;
      color: var(--ink);
    }
    .log-item.edu {
      border-left: 3px solid var(--gold);
      background: #f8efd6;
    }
    .log-item.edu::before {
      content: "Did you know ·"; display: block;
      margin-bottom: 3px; color: var(--gold-deep);
      font-size: 10px; font-weight: 800;
      letter-spacing: 0.10em; text-transform: uppercase;
    }

    /*  ────────────  MODALS  ──────────── */
    .modal-wrap {
      position: fixed; inset: 0;
      background: rgba(20, 15, 5, 0.42);
      backdrop-filter: blur(2px);
      display: grid; place-items: center;
      padding: 20px; z-index: 100;
    }
    .modal {
      width: min(720px, 100%);
      max-height: calc(100vh - 40px);
      overflow: auto;
      background: var(--card);
      border-radius: 6px;
      border: 1px solid var(--rule);
      box-shadow: var(--shadow-2);
      position: relative;
    }
    .modal::before {
      content: ""; position: absolute; inset: 8px;
      border: 1px solid var(--rule-soft); pointer-events: none;
      border-radius: 3px;
    }
    .modal .header { padding: 18px 22px; border-bottom: 1px solid var(--rule-soft); }
    .modal .content { padding: 18px 22px; }
    .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    /* discard picker */
    .discard-row {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
      padding: 8px;
      background: var(--card-soft); border: 1px solid var(--rule-soft);
      border-radius: 5px;
    }
    .discard-cell { text-align: center; }
    .discard-cell .nudge {
      display: flex; gap: 4px; justify-content: center; margin-top: 6px;
    }
    .nudge button {
      width: 24px; height: 24px; border-radius: 4px;
      border: 1px solid var(--rule); background: var(--card);
      cursor: pointer; font-weight: 800; line-height: 1;
    }
    .nudge button:disabled { opacity: 0.35; cursor: not-allowed; }

    /* footer note in panels */
    .footer-note {
      padding: 10px 18px 14px; color: var(--ink-faint);
      font-size: 11px; line-height: 1.45; border-top: 1px solid var(--rule-soft);
      background: rgba(0,0,0,0.015);
    }

    /*  ────────────  RESPONSIVE  ──────────── */
    @media (max-width: 1280px) {
      .app { grid-template-columns: 280px 1fr 320px; }
    }
    @media (max-width: 1100px) {
      .app { grid-template-columns: 1fr; }
      .board-panel { min-height: auto; }
      .modal-grid { grid-template-columns: 1fr; }
    }

    /* scrollbar (keep paper-like) */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 999px; border: 2px solid var(--card); }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
  (() => {
  /* ──────────────────────────────────────────────────────────────
     CONSTANTS
     ────────────────────────────────────────────────────────────── */

  const RESOURCES = [
    { key: 'cy', short: 'CY', label: 'Cytokine',  color: 'var(--cy)',
      desc: 'Inflammatory signals such as TNF, IL-6, IL-17. Many autoimmune drugs work by blocking dominant cytokines.' },
    { key: 'bc', short: 'BC', label: 'B-Cell',    color: 'var(--bc)',
      desc: 'B cells produce autoantibodies and help activate other immune cells. Targets in lupus, MS, and others.' },

  function shuffle(array) {
    const a = array.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function round2(n) { return Math.round(n * 100) / 100; }

  /* ──────────────────────────────────────────────────────────────
     BOARD GENERATION
     19 hexes in a 3-4-5-4-3 layout (Catan), pointy-top.
     Vertices and edges deduped via rounded coordinate keys.
     Number tokens placed with retry to enforce no-adjacent-6-or-8.
     ────────────────────────────────────────────────────────────── */
  function axialToPixel(q, r, size) {
    return { x: size * Math.sqrt(3) * (q + r / 2), y: size * 1.5 * r };
  }
  function hexCorners(cx, cy, size) {
    const out = [];
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 180 * (60 * i - 30);
      out.push({ x: round2(cx + size * Math.cos(a)), y: round2(cy + size * Math.sin(a)) });
    }
    return out;
  }
  function vKey(p) { return `${p.x.toFixed(2)},${p.y.toFixed(2)}`; }

  function tilesAdjacent(a, b) {
    /* Two tiles are board-adjacent if they share at least 2 vertex IDs. */
    let n = 0;
    for (const va of a.vertexIds) if (b.vertexIds.includes(va)) n++;
    return n >= 2;
  }

  function placeNumbersWithoutHotAdjacency(tiles, numbers) {
    /* Try repeatedly to drop NUMBER_TOKENS in shuffled order onto non-trigger tiles
       so no 6 or 8 is adjacent to another 6 or 8. */
    const productive = tiles.filter(t => t.type !== 'trigger');
    for (let attempt = 0; attempt < 400; attempt++) {
      const shuffled = shuffle(numbers);
      productive.forEach((t, i) => { t.number = shuffled[i]; });
      let bad = false;
      for (const t of productive) {
        if (t.number !== 6 && t.number !== 8) continue;
        for (const u of productive) {
          if (u.id === t.id) continue;
          if ((u.number === 6 || u.number === 8) && tilesAdjacent(t, u)) { bad = true; break; }
        }
        if (bad) break;
      }
      if (!bad) return;
    }
    /* Fallback (should not reach): leave the last shuffle. */
  }

  function createBoard() {
    const size = 60;
    const coords = [];
    for (let q = -2; q <= 2; q++) {
      const r1 = Math.max(-2, -q - 2);
      const r2 = Math.min(2,  -q + 2);
      for (let r = r1; r <= r2; r++) coords.push({ q, r });
    }

    const types = shuffle(TILE_TYPES);
    const sites = shuffle(SITES);
    const tiles = coords.map((coord, i) => {
      const c = axialToPixel(coord.q, coord.r, size);
      const type = types[i];
      const site = type === 'trigger' ? 'Trigger' : sites.shift();
      const corners = hexCorners(c.x, c.y, size);
      return {
        id: i,
        q: coord.q, r: coord.r,
        x: c.x, y: c.y, size,
        type, site,
        number: null,
        corners,
        vertexIds: []
      };
    });

    /* Build vertex + edge graphs with dedup. */
    const vertexMap = new Map();
    const getVertex = (pt) => {
      const key = vKey(pt);
      if (!vertexMap.has(key)) {
        vertexMap.set(key, {
          id: vertexMap.size,
          x: pt.x, y: pt.y,
          tiles: [], neighbors: new Set(),
          occupant: null
        });
      }
      return vertexMap.get(key);
    };

    tiles.forEach(tile => {
      tile.corners.forEach(pt => {
        const v = getVertex(pt);
        v.tiles.push(tile.id);
        tile.vertexIds.push(v.id);
      });
    });

    const edgeMap = new Map();
    tiles.forEach(tile => {
      for (let i = 0; i < 6; i++) {
        const a = tile.vertexIds[i];
        const b = tile.vertexIds[(i + 1) % 6];
        const lo = Math.min(a, b), hi = Math.max(a, b);
        vertexMap.forEach(v => {
          if (v.id === lo) v.neighbors.add(hi);
          if (v.id === hi) v.neighbors.add(lo);
        });
        const key = `${lo}-${hi}`;
        if (!edgeMap.has(key)) {
          edgeMap.set(key, { id: edgeMap.size, v1: lo, v2: hi, owner: null, tiles: [] });
        }
        edgeMap.get(key).tiles.push(tile.id);
      }
    });

    const vertices = Array.from(vertexMap.values()).map(v => ({
      ...v, neighbors: Array.from(v.neighbors)
    }));
    const edges = Array.from(edgeMap.values());

    placeNumbersWithoutHotAdjacency(tiles, NUMBER_TOKENS);

    return { tiles, vertices, edges };
  }

  function isSetup() { return game.setup.step < game.setup.order.length; }
  function curPlayer() { return game.players[game.currentPlayer]; }
  function activePlayer() {

  function adjacentEdges(vId) { return game.board.edges.filter(e => e.v1 === vId || e.v2 === vId); }
  function vertexAt(vId) { return game.board.vertices[vId]; }
  function ownsAdjPath(pid, vId) { return adjacentEdges(vId).some(e => e.owner === pid); }

  function canBuildClinicAt(pid, vId, isSetup_) {
    const v = vertexAt(vId);
    if (v.occupant) return false;
    for (const n of v.neighbors) if (vertexAt(n).occupant) return false; /* distance rule */
    if (isSetup_) return true;
    return ownsAdjPath(pid, vId);
  }
  function canBuildPathAt(pid, eId, isSetup_, anchorVId = null) {
    const e = game.board.edges[eId];
    if (e.owner !== null) return false;
    if (isSetup_) {
      return anchorVId !== null && (e.v1 === anchorVId || e.v2 === anchorVId);
    }
    const v1 = vertexAt(e.v1), v2 = vertexAt(e.v2);
    /* Connects via player's clinic/research at that vertex, OR via player's path at that vertex
       (provided the vertex isn\u2019t blocked by another player\u2019s clinic). */
    return [v1, v2].some(v => {
      const occByOther = v.occupant && v.occupant.playerId !== pid;
      if (occByOther) return false;
      if (v.occupant && v.occupant.playerId === pid) return true;
      return ownsAdjPath(pid, v.id);
    });
  }
  function validClinicVerts(pid) {
    return game.board.vertices.filter(v => canBuildClinicAt(pid, v.id, false)).map(v => v.id);
  }
  function validResearchVerts(pid) {

      .filter(v => v.occupant && v.occupant.playerId === pid && v.occupant.type === 'clinic')
      .map(v => v.id);

  function validPathEdges(pid) {
    return game.board.edges.filter(e => canBuildPathAt(pid, e.id, false)).map(e => e.id);

  /* ──────────────────────────────────────────────────────────────
     LONGEST PATHWAY (Catan's longest road)
     DFS from each endpoint of player's edges; the cap is reset when
     traversal hits a vertex occupied by another player.
     ────────────────────────────────────────────────────────────── */
  function longestPathwayLength(pid) {
    const myEdges = game.board.edges.filter(e => e.owner === pid);
    if (!myEdges.length) return 0;

    const adjBy = new Map(); /* vertexId -> [edges] */
    myEdges.forEach(e => {
      [e.v1, e.v2].forEach(vid => {
        const v = vertexAt(vid);
        const blocked = v.occupant && v.occupant.playerId !== pid;
        /* still record; we'll block traversal *through* an enemy-owned vertex */
        if (!adjBy.has(vid)) adjBy.set(vid, []);
        adjBy.get(vid).push({ e, blocked });
      });
    });

    let best = 0;
    function dfs(vid, used, length, fromEdgeId) {
      if (length > best) best = length;
      const v = vertexAt(vid);
      const blockHere = v.occupant && v.occupant.playerId !== pid;
      if (blockHere) return; /* can\u2019t pass through enemy */
      const arr = adjBy.get(vid) || [];
      for (const { e } of arr) {
        if (used.has(e.id)) continue;
        used.add(e.id);
        const nv = (e.v1 === vid) ? e.v2 : e.v1;
        dfs(nv, used, length + 1, e.id);
        used.delete(e.id);
      }
    }

    /* Start DFS from every endpoint of every owned edge. */
    const seen = new Set();
    myEdges.forEach(e => {
      [e.v1, e.v2].forEach(vid => {
        if (seen.has(vid)) return;
        seen.add(vid);
        dfs(vid, new Set(), 0, null);
      });
    });
    return best;
  }
  function updateLongest() {
    let bestLen = 4;       /* must be 5+ to claim */
    let bestPid = null;
    let tie = false;
    game.players.forEach(p => {
      const L = longestPathwayLength(p.id);
      if (L > bestLen) { bestLen = L; bestPid = p.id; tie = false; }
      else if (L === bestLen && L >= 5) { tie = true; }
    });
    /* If currently held and someone tied — current holder keeps it. */
    if (tie && game.longestOwner !== null) {
      const cur = longestPathwayLength(game.longestOwner);
      if (cur === bestLen) bestPid = game.longestOwner;
    }
    /* Update flag on players. */
    const prevOwner = game.longestOwner;
    game.players.forEach(p => p.hasLongest = (p.id === bestPid));
    game.longestOwner = bestPid;
    game.longestLength = bestPid !== null ? bestLen : 0;
    if (bestPid !== null && bestPid !== prevOwner) {
      log(`${game.players[bestPid].name} now holds Strongest Pathway Network (${bestLen}).`);
      edu(EDU_FACTS.longest);
    }
  }

  function updateMostTherapy() {
    let best = 2;          /* must be 3+ to claim */
    let owner = null;
    let tie = false;
    game.players.forEach(p => {
      if (p.therapiesPlayed > best) { best = p.therapiesPlayed; owner = p.id; tie = false; }
      else if (p.therapiesPlayed === best && best >= 3) { tie = true; }
    });
    if (tie && game.mostTherapyOwner !== null) {
      const cur = game.players[game.mostTherapyOwner].therapiesPlayed;
      if (cur === best) owner = game.mostTherapyOwner;
    }
    const prev = game.mostTherapyOwner;
    game.mostTherapyOwner = owner;
    game.mostTherapyCount = owner !== null ? best : 0;
    if (owner !== null && owner !== prev) {
      log(`${game.players[owner].name} now leads Most Comprehensive Care (${best} played).`);
      edu(EDU_FACTS.network);
    }
  }

  function victoryPoints(p) {
    let vp = p.clinics.length + p.research.length * 2 + p.hiddenVp;
    if (p.hasLongest) vp += 2;
    if (game.mostTherapyOwner === p.id) vp += 2;
    return vp;
  }
  /* Public-facing VP (excludes hidden VP unless game is over). */
  function publicVp(p) {
    let vp = p.clinics.length + p.research.length * 2;
    if (p.hasLongest) vp += 2;
    if (game.mostTherapyOwner === p.id) vp += 2;
    return vp;
  }
  function checkWinner() {
    for (const p of game.players) {
      if (victoryPoints(p) >= VICTORY_TARGET) {
        game.winner = p.id;
        showSummary = true;
        return;
      }
    }
  }

  /* ──────────────────────────────────────────────────────────────
     BUILD ACTIONS
     ────────────────────────────────────────────────────────────── */
  function placeClinic(pid, vId, asResearch = false) {
    const v = vertexAt(vId);
    v.occupant = { playerId: pid, type: asResearch ? 'research' : 'clinic' };
    const p = game.players[pid];
    if (asResearch) {
      p.clinics = p.clinics.filter(x => x !== vId);
      p.research.push(vId);
    } else {
      p.clinics.push(vId);
    }
  }
  function placePath(pid, eId) {
    game.board.edges[eId].owner = pid;
    game.players[pid].pathways.push(eId);
  }
  function grantSetupResources(pid, vId) {
    const p = game.players[pid];
    vertexAt(vId).tiles.forEach(tId => {
      const t = game.board.tiles[tId];
      if (t.type === 'trigger') return;
      if (game.bank[t.type] > 0) {
        p.resources[t.type] += 1;
        game.bank[t.type] -= 1;
      }
    });
  }

  function setupClickVertex(vId) {
    const pid = game.setup.order[game.setup.step];
    if (!canBuildClinicAt(pid, vId, true)) return;
    placeClinic(pid, vId, false);
    game.setup.awaitingPathFromVertex = vId;
    log(`${game.players[pid].name} placed a starting clinic.`);
    if (game.setup.step === 0) edu(EDU_FACTS.setup);
    render();
  }
  function setupClickEdge(eId) {
    const pid = game.setup.order[game.setup.step];
    if (!canBuildPathAt(pid, eId, true, game.setup.awaitingPathFromVertex)) return;
    placePath(pid, eId);
    /* On the second placement (back half of the snake), grant resources from that clinic. */
    if (game.setup.step >= game.players.length) {
      grantSetupResources(pid, game.setup.awaitingPathFromVertex);
    }
    game.setup.awaitingPathFromVertex = null;
    game.setup.step += 1;
    if (!isSetup()) {
      game.currentPlayer = 0;
      log(`Setup complete. ${curPlayer().name} starts.`);
      edu(EDU_FACTS.tolerance);
    }
    render();
  }

  function buildPathway(eId, free = false) {
    const p = curPlayer();
    if (!canBuildPathAt(p.id, eId, false)) return;
    if (!free) {
      if (!canAfford(p, COSTS.pathway)) return;
      spend(p, COSTS.pathway); addRes(game.bank, COSTS.pathway);
    }
    placePath(p.id, eId);
    log(`${p.name} built a Pathway.`);
    if (game.freePathways > 0) {
      game.freePathways -= 1;
      if (game.freePathways === 0) game.pendingAction = null;
    } else {
      game.pendingAction = null;
    }
    edu(EDU_FACTS.pathway);
    updateLongest();
    checkWinner();
    render();
  }
  function buildClinic(vId) {
    const p = curPlayer();
    if (!canBuildClinicAt(p.id, vId, false)) return;
    if (!canAfford(p, COSTS.clinic)) return;
    spend(p, COSTS.clinic); addRes(game.bank, COSTS.clinic);
    placeClinic(p.id, vId, false);
    log(`${p.name} built a Clinic.`);
    edu(EDU_FACTS.clinic);
    game.pendingAction = null;
    updateLongest();   /* opponent's path may now be cut */
    checkWinner();
    render();
  }
  function upgradeResearch(vId) {
    const p = curPlayer();
    const occ = vertexAt(vId).occupant;
    if (!occ || occ.playerId !== p.id || occ.type !== 'clinic') return;
    if (!canAfford(p, COSTS.research)) return;
    spend(p, COSTS.research); addRes(game.bank, COSTS.research);
    placeClinic(p.id, vId, true);
    log(`${p.name} upgraded a Clinic to a Research Center.`);
    edu(EDU_FACTS.research);
    game.pendingAction = null;
    checkWinner();
    render();
  }

  /* ──────────────────────────────────────────────────────────────
     THERAPY CARDS
     ────────────────────────────────────────────────────────────── */
  function buyTherapy() {
    const p = curPlayer();
    if (isSetup() || !game.rolled || game.moveFlareRequired || game.winner !== null) return;
    if (!canAfford(p, COSTS.therapy) || !game.deck.length) return;
    spend(p, COSTS.therapy); addRes(game.bank, COSTS.therapy);
    const card = game.deck.pop();
    if (card.kind === 'vp') {
      p.hiddenVp += 1;
      log(`${p.name} drew a Precision Breakthrough.`);
      edu(card.learn);
    } else {
      p.hand.push(card);
      p.handFresh.push(p.hand.length - 1);
      log(`${p.name} drew ${card.title}.`);
    }
    checkWinner();
    render();
  }

  function selectCard(idx) {
    if (idx === game.selectedCardIdx) game.selectedCardIdx = null;
    else game.selectedCardIdx = idx;
    render();
  }

  function playSelectedCard() {
    const p = curPlayer();
    const idx = game.selectedCardIdx;
    if (idx === null || idx === undefined) return;
    if (p.handFresh.includes(idx)) return; /* drawn this turn */
    const card = p.hand[idx];
    if (!card) return;

    if (card.kind === 'flare') {
      game.pendingAction = 'flareCard';
      game.pendingCardIdx = idx;
      edu(card.learn);
    } else if (card.kind === 'plenty') {
      game.pendingAction = 'plenty';
      game.pendingCardIdx = idx;
      game.tempPick = [];
      edu(card.learn);
    } else if (card.kind === 'monopoly') {
      game.pendingAction = 'monopoly';
      game.pendingCardIdx = idx;
      edu(card.learn);
    } else if (card.kind === 'roads') {
      p.hand.splice(idx, 1);
      p.handFresh = p.handFresh.filter(i => i !== idx).map(i => i > idx ? i - 1 : i);
      p.therapiesPlayed += 1;
      game.freePathways = 2;
      game.pendingAction = 'pathway';
      game.selectedCardIdx = null;
      log(`${p.name} played ${card.title} — 2 free Pathways.`);
      edu(card.learn);
      updateMostTherapy();
    }
    render();
  }

  function resolvePlentyPick(rk) {
    if (game.pendingAction !== 'plenty') return;
    if (game.bank[rk] <= 0) return;
    const p = curPlayer();
    p.resources[rk] += 1;
    game.bank[rk] -= 1;
    game.tempPick.push(rk);
    if (game.tempPick.length >= 2) {
      const idx = game.pendingCardIdx;
      const card = p.hand[idx];
      p.hand.splice(idx, 1);
      p.handFresh = p.handFresh.filter(i => i !== idx).map(i => i > idx ? i - 1 : i);
      p.therapiesPlayed += 1;
      log(`${p.name} played ${card.title} — took ${R[game.tempPick[0]].short}, ${R[game.tempPick[1]].short}.`);
      game.tempPick = [];
      game.pendingAction = null;
      game.pendingCardIdx = null;
      game.selectedCardIdx = null;
      updateMostTherapy();
      checkWinner();
    }
    render();
  }

  function resolveMonopolyPick(rk) {
    if (game.pendingAction !== 'monopoly') return;
    const p = curPlayer();
    const idx = game.pendingCardIdx;
    const card = p.hand[idx];
    let gained = 0;
    game.players.forEach(o => {
      if (o.id === p.id) return;
      gained += o.resources[rk];
      p.resources[rk] += o.resources[rk];
      o.resources[rk] = 0;
    });
    p.hand.splice(idx, 1);
    p.handFresh = p.handFresh.filter(i => i !== idx).map(i => i > idx ? i - 1 : i);
    p.therapiesPlayed += 1;
    game.pendingAction = null;
    game.pendingCardIdx = null;
    game.selectedCardIdx = null;
    log(`${p.name} played ${card.title} — collected ${gained} ${R[rk].short}.`);
    updateMostTherapy();
    checkWinner();
    render();
  }

  /* ──────────────────────────────────────────────────────────────
     DICE + 7-FLARE + MOVE FLARE
     ────────────────────────────────────────────────────────────── */
  function rollDice() {
    if (isSetup() || game.rolled || game.winner !== null) return;
    const a = 1 + Math.floor(Math.random() * 6);
    const b = 1 + Math.floor(Math.random() * 6);
    game.diceA = a; game.diceB = b;
    game.dice = a + b;
    game.diceRolling = true;
    game.rolled = true;
    log(`${curPlayer().name} rolled ${a} + ${b} = ${a + b}.`);
    /* turn off rolling flag after CSS animation */
    setTimeout(() => { if (!game) return; game.diceRolling = false; render(); }, 600);

    if (game.dice === 7) {
      /* Build discard queue: any player with > 7 cards owes floor(n/2). */
      game.discardQueue = game.players
        .filter(p => sumRes(p.resources) > 7)
        .map(p => p.id);
      if (game.discardQueue.length) {
        startNextDiscard();
      } else {
        game.moveFlareRequired = true;
        game.pendingAction = 'flareRoll';
      }
      edu(EDU_FACTS.flare);
    } else {
      produceResources(game.dice);
    }
    render();
  }

  function startNextDiscard() {
    const pid = game.discardQueue[0];
    if (pid === undefined) {
      game.discardCurrent = null;
      game.moveFlareRequired = true;
      game.pendingAction = 'flareRoll';
      return;
    }
    const total = sumRes(game.players[pid].resources);
    const owe = Math.floor(total / 2);
    game.discardCurrent = { playerId: pid, owe, picks: blankRes() };
    game.pendingAction = 'discard';
  }
  function discardNudge(rk, delta) {
    const dc = game.discardCurrent;
    if (!dc) return;
    const p = game.players[dc.playerId];
    const newVal = (dc.picks[rk] || 0) + delta;
    if (newVal < 0) return;
    if (newVal > p.resources[rk]) return;
    const totalPicked = RKEYS.reduce((n, k) => n + (dc.picks[k] || 0), 0) + delta;
    if (totalPicked > dc.owe) return;
    dc.picks[rk] = newVal;
    render();
  }
  function confirmDiscard() {
    const dc = game.discardCurrent;
    if (!dc) return;
    const totalPicked = RKEYS.reduce((n, k) => n + (dc.picks[k] || 0), 0);
    if (totalPicked !== dc.owe) return;
    const p = game.players[dc.playerId];
    RKEYS.forEach(k => {
      p.resources[k] -= dc.picks[k] || 0;
      game.bank[k]  += dc.picks[k] || 0;
    });
    log(`${p.name} discarded ${dc.owe} resources during the flare.`);
    edu(EDU_FACTS.discard);
    game.discardQueue.shift();
    startNextDiscard();
    render();
  }

  function produceResources(roll) {
    /* Track which players gained what for an animation hint. */
    game.board.tiles.forEach(t => {
      if (t.number !== roll) return;
      if (t.id === game.flareTileId) return;
      if (t.type === 'trigger') return;
      t.vertexIds.forEach(vId => {
        const occ = vertexAt(vId).occupant;
        if (!occ) return;
        const amt = occ.type === 'research' ? 2 : 1;
        const got = Math.min(amt, game.bank[t.type]);
        if (got > 0) {
          game.players[occ.playerId].resources[t.type] += got;
          game.bank[t.type] -= got;
        }
      });
    });
    log(`Tiles showing ${roll} produced resources.`);
  }

  function clickFlareTile(tileId) {
    if (!(game.pendingAction === 'flareRoll' || game.pendingAction === 'flareCard')) return;
    if (tileId === game.flareTileId) return; /* must move */
    const fromCard = (game.pendingAction === 'flareCard');
    game.flareTileId = tileId;
    log(`${curPlayer().name} moved the Flare to the ${game.board.tiles[tileId].site} tile.`);

    /* Compute steal candidates: opponents adjacent to that tile with cards. */
    const cands = new Set();
    game.board.tiles[tileId].vertexIds.forEach(vId => {
      const occ = vertexAt(vId).occupant;
      if (occ && occ.playerId !== game.currentPlayer) {
        if (sumRes(game.players[occ.playerId].resources) > 0) cands.add(occ.playerId);
      }
    });
    game.stealOptions = Array.from(cands);
    game.stealTileId = tileId;
    game.stealFromCard = fromCard;
    game.moveFlareRequired = false;

    if (game.stealOptions.length === 0) {
      finishFlareNoSteal();
    } else if (game.stealOptions.length === 1) {
      doSteal(game.stealOptions[0]);
    } else {
      game.pendingAction = 'steal';
    }
    render();
  }
  function doSteal(targetId) {
    const target = game.players[targetId];
    const stealer = curPlayer();
    const rk = randomFromHand(target);
    if (rk) {
      target.resources[rk] -= 1;
      stealer.resources[rk] += 1;
      log(`${stealer.name} took 1 ${R[rk].short} from ${target.name}.`);
    }
    finishFlareNoSteal();
  }
  function finishFlareNoSteal() {
    if (game.stealFromCard) {
      const p = curPlayer();
      const idx = game.pendingCardIdx;
      const card = p.hand[idx];
      if (card) {
        p.hand.splice(idx, 1);
        p.handFresh = p.handFresh.filter(i => i !== idx).map(i => i > idx ? i - 1 : i);
        p.therapiesPlayed += 1;
        log(`${p.name} played ${card.title}.`);
        updateMostTherapy();
      }
    }
    game.pendingAction = null;
    game.pendingCardIdx = null;
    game.selectedCardIdx = null;
    game.stealOptions = [];
    game.stealFromCard = false;
    checkWinner();
  }

  /* ──────────────────────────────────────────────────────────────
     TRADE + END TURN
     ────────────────────────────────────────────────────────────── */
  function doTrade() {
    if (isSetup() || !game.rolled || game.moveFlareRequired || game.winner !== null) return;
    const p = curPlayer();
    const { give, get } = game.trade;
    if (give === get) return;
    if (p.resources[give] < 4 || game.bank[get] < 1) return;
    p.resources[give] -= 4; game.bank[give] += 4;
    p.resources[get] += 1;  game.bank[get]  -= 1;
    log(`${p.name} traded 4 ${R[give].short} for 1 ${R[get].short}.`);
    render();
  }
  function setTrade(side, key) {
    game.trade[side] = key;
    render();
  }

  function endTurn() {
    if (isSetup() || game.moveFlareRequired || game.winner !== null) return;
    if (!game.rolled) return;
    if (game.pendingAction && game.pendingAction !== null) return;

    /* Reset turn state */
    game.pendingAction = null;
    game.pendingCardIdx = null;
    game.selectedCardIdx = null;
    game.tempPick = [];
    game.freePathways = 0;
    game.rolled = false;
    game.diceA = null; game.diceB = null;
    game.dice = null;
    /* Cards drawn this turn are now playable next turn. */
    game.players[game.currentPlayer].handFresh = [];
    game.currentPlayer = (game.currentPlayer + 1) % game.players.length;
    if (game.currentPlayer === 0) game.turn += 1;
    log(`Turn ${game.turn} \u00b7 ${curPlayer().name}\u2019s turn begins.`);
    render();
  }

  function setAction(action) {
    if (isSetup() || game.moveFlareRequired || game.winner !== null) return;
    if (!game.rolled) return;
    /* Toggle */
    if (game.pendingAction === action) game.pendingAction = null;
    else game.pendingAction = action;
    game.selectedCardIdx = null;
    render();
  }

  function clickTile(tileId) {
    game.selectedTileId = tileId;
    if (game.pendingAction === 'flareRoll' || game.pendingAction === 'flareCard') {
      return clickFlareTile(tileId);
    }
    render();
  }
  function clickVertex(vId) {
    if (isSetup()) {
      if (game.setup.awaitingPathFromVertex === null) return setupClickVertex(vId);
      return;
    }
    if (game.pendingAction === 'clinic') return buildClinic(vId);
    if (game.pendingAction === 'research') return upgradeResearch(vId);
    /* otherwise inspect */
    render();
  }
  function clickEdge(eId) {
    if (isSetup()) {
      if (game.setup.awaitingPathFromVertex !== null) return setupClickEdge(eId);
      return;
    }
    if (game.pendingAction === 'pathway' || game.freePathways > 0) {
      const free = game.freePathways > 0;
      return buildPathway(eId, free);
    }
    render();
  }

  function startGame() {
    const count = startConfig.count;
    const names = startConfig.names.slice(0, count);
    game = createGame(count, names);
    log('Welcome to Tolerance. Build clinics, manage flares, and restore self-tolerance.');
    edu(EDU_FACTS.intro);
    showStart = false;
    showRules = false;
    showSummary = false;
    render();
  }

  function restart() {
    game = null;
    showStart = true;
    showRules = false;
    showSummary = false;
    render();
  }
  function cancelAction() {
    if (game.pendingAction === 'plenty' || game.pendingAction === 'monopoly' || game.pendingAction === 'flareCard') {
      /* selecting / mid-card - just back out without consuming the card */
      game.pendingAction = null;
      game.pendingCardIdx = null;
      game.tempPick = [];
    } else {
      game.pendingAction = null;
    }
    render();
  }

  /* ──────────────────────────────────────────────────────────────
     RENDER · BOARD (SVG)
     ────────────────────────────────────────────────────────────── */
  function validSets() {
    if (!game) return { paths: new Set(), clinics: new Set(), researchUpgrades: new Set(), setupV: new Set(), setupE: new Set() };
    const pid = curPlayer().id;
    const inSetup = isSetup();
    const setupPid = inSetup ? game.setup.order[game.setup.step] : null;

    const paths = new Set(
      ((game.pendingAction === 'pathway' || game.freePathways > 0) && !inSetup)
        ? validPathEdges(pid)
        : []
    );
    const clinics = new Set(
      (game.pendingAction === 'clinic' && !inSetup)
        ? validClinicVerts(pid)
        : []
    );
    const researchUpgrades = new Set(
      (game.pendingAction === 'research' && !inSetup)
        ? validResearchVerts(pid)
        : []
    );
    const setupV = new Set(
      (inSetup && game.setup.awaitingPathFromVertex === null)
        ? game.board.vertices.filter(v => canBuildClinicAt(setupPid, v.id, true)).map(v => v.id)
        : []
    );
    const setupE = new Set(
      (inSetup && game.setup.awaitingPathFromVertex !== null)
        ? game.board.edges.filter(e => canBuildPathAt(setupPid, e.id, true, game.setup.awaitingPathFromVertex)).map(e => e.id)
        : []
    );
    return { paths, clinics, researchUpgrades, setupV, setupE };
  }

  function flareTargetable(tileId) {
    if (!(game.pendingAction === 'flareRoll' || game.pendingAction === 'flareCard')) return false;
    return tileId !== game.flareTileId;
  }

  function renderBoard() {
    const tiles = game.board.tiles;
    const xs = tiles.flatMap(t => t.corners.map(c => c.x));
    const ys = tiles.flatMap(t => t.corners.map(c => c.y));
    const minX = Math.min(...xs) - 90, minY = Math.min(...ys) - 90;
    const width  = Math.max(...xs) - Math.min(...xs) + 180;
    const height = Math.max(...ys) - Math.min(...ys) + 180;
    const valid = validSets();

    const tileSvg = tiles.map(tile => {
      const points = tile.corners.map(c => `${c.x},${c.y}`).join(' ');
      const isFlare = tile.id === game.flareTileId;
      const selected = game.selectedTileId === tile.id;
      const targetable = flareTargetable(tile.id);
      const fill = TILE_FILL[tile.type];
      const stroke = targetable ? '#c2453a' : (selected ? '#1d2330' : TILE_STROKE[tile.type]);
      const strokeW = targetable ? 3 : (selected ? 3 : 1.5);

      const numToken = tile.number !== null ? `
        <g class="num-token" transform="translate(${tile.x}, ${tile.y + 18})">
          <circle r="14" fill="#faf6ec" stroke="#766b5a" stroke-width="0.8"></circle>
          <text y="5" text-anchor="middle" font-size="14" font-weight="800"
                fill="${(tile.number === 6 || tile.number === 8) ? '#c2453a' : '#1d2330'}"
                font-family="'Inter Tight', sans-serif">${tile.number}</text>
          ${dotsForNumber(tile.number)}
        </g>` : '';

      const flareMark = isFlare ? `
        <g transform="translate(${tile.x + 26}, ${tile.y - 26})">
          <circle r="13" fill="#c2453a" stroke="#9d352b" stroke-width="1.5"></circle>
          <text y="5" text-anchor="middle" font-size="14" font-weight="900" fill="#faf6ec"
                font-family="'Inter Tight', sans-serif">!</text>
        </g>` : '';

      const glyph = `<g transform="translate(${tile.x}, ${tile.y - 18})" opacity="0.85">${RES_GLYPH[tile.type] || ''}</g>`;
      const siteLbl = `
        <text x="${tile.x}" y="${tile.y - 32}" text-anchor="middle" font-size="9" font-weight="800"
              fill="#1d2330" letter-spacing="0.06em"
              font-family="'Inter Tight', sans-serif">${tile.site.toUpperCase()}</text>`;
      const resLbl = tile.type === 'trigger' ? `
        <text x="${tile.x}" y="${tile.y + 0}" text-anchor="middle" font-size="9" fill="#5b5048"
              font-style="italic" font-family="'Fraunces', serif">no production</text>
      ` : `
        <text x="${tile.x}" y="${tile.y + 4}" text-anchor="middle" font-size="9" fill="#1d2330"
              font-weight="700" letter-spacing="0.08em"
              font-family="'Inter Tight', sans-serif">${tile.type.toUpperCase()}</text>
      `;

      return `
        <g class="hex ${selected ? 'selected' : ''} ${isFlare ? 'flare' : ''}" onclick="G.clickTile(${tile.id})">
          <polygon points="${points}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeW}"></polygon>
          ${siteLbl}
          ${glyph}
          ${resLbl}
          ${numToken}
          ${flareMark}
        </g>`;
    }).join('');

    const edgeSvg = game.board.edges.map(edge => {
      const a = vertexAt(edge.v1), b = vertexAt(edge.v2);
      const owner = edge.owner !== null ? game.players[edge.owner] : null;
      const validHere = valid.paths.has(edge.id) || valid.setupE.has(edge.id);
      const stroke = owner ? owner.colorHex : (validHere ? '#1d2330' : 'transparent');
      const sw = owner ? 7 : (validHere ? 6 : 0);
      const cls = validHere ? 'edge-line valid' : 'edge-line';
      return `
        <g class="edge-hit" onclick="G.clickEdge(${edge.id})">
          <line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"
                stroke="rgba(0,0,0,0)" stroke-width="20" stroke-linecap="round"></line>
          <line class="${cls}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"
                stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round"></line>
        </g>`;
    }).join('');

    const vertexSvg = game.board.vertices.map(v => {
      const occ = v.occupant;
      const validHere = valid.clinics.has(v.id) || valid.setupV.has(v.id) || valid.researchUpgrades.has(v.id);
      if (!occ) {
        if (!validHere) {
          /* invisible hit target only when nothing valid; tiny dot for orientation */
          return `<g class="vert-hit" onclick="G.clickVertex(${v.id})"><circle cx="${v.x}" cy="${v.y}" r="14" fill="rgba(0,0,0,0)"></circle></g>`;
        }
        return `
          <g class="vert-hit" onclick="G.clickVertex(${v.id})">
            <circle cx="${v.x}" cy="${v.y}" r="14" fill="rgba(0,0,0,0)"></circle>
            <circle class="vert-target" cx="${v.x}" cy="${v.y}" r="7" fill="#1d2330" pointer-events="none"></circle>
          </g>`;
      }
      const p = game.players[occ.playerId];
      if (occ.type === 'clinic') {
        /* House: square base + roof */
        const s = 9;
        const upgradable = valid.researchUpgrades.has(v.id);
        return `
          <g class="vert-hit" onclick="G.clickVertex(${v.id})">
            <circle cx="${v.x}" cy="${v.y}" r="16" fill="rgba(0,0,0,0)"></circle>
            <g pointer-events="none" transform="translate(${v.x}, ${v.y})">
              <polygon points="0,-12 ${s+1},-3 ${s+1},9 ${-(s+1)},9 ${-(s+1)},-3"
                       fill="${p.colorHex}" stroke="${upgradable ? '#1d2330' : '#faf6ec'}"
                       stroke-width="${upgradable ? 2.4 : 1.6}"></polygon>
              <rect x="-2.5" y="2" width="5" height="7" fill="#faf6ec" opacity="0.65"></rect>
            </g>
          </g>`;
      }
      /* Research center: building with steeple */
      const s = 11;
      return `
        <g class="vert-hit" onclick="G.clickVertex(${v.id})">
          <circle cx="${v.x}" cy="${v.y}" r="18" fill="rgba(0,0,0,0)"></circle>
          <g pointer-events="none" transform="translate(${v.x}, ${v.y})">
            <rect x="${-s}" y="${-3}" width="${s*2}" height="${s + 2}"
                  fill="${p.colorHex}" stroke="#faf6ec" stroke-width="1.6" rx="1"></rect>
            <rect x="-3" y="-13" width="6" height="11"
                  fill="${p.colorHex}" stroke="#faf6ec" stroke-width="1.6" rx="1"></rect>
            <polygon points="0,-19 5,-13 -5,-13" fill="${p.colorHex}" stroke="#faf6ec" stroke-width="1.6"></polygon>
          </g>
        </g>`;
    }).join('');

    return `<svg class="board" viewBox="${minX} ${minY} ${width} ${height}">${tileSvg}${edgeSvg}${vertexSvg}</svg>`;
  }

  function dotsForNumber(n) {
    /* Tiny pip dots beneath the number, like a Catan token. */
    const pips = { 2: 1, 12: 1, 3: 2, 11: 2, 4: 3, 10: 3, 5: 4, 9: 4, 6: 5, 8: 5 };
    const k = pips[n] || 0;
    if (!k) return '';
    const r = 0.8;
    const sp = 1.8;
    const total = (k - 1) * sp;
    const start = -total / 2;
    let out = '';
    const color = (n === 6 || n === 8) ? '#c2453a' : '#1d2330';
    for (let i = 0; i < k; i++) {
      out += `<circle cx="${start + i * sp}" cy="11" r="${r}" fill="${color}"></circle>`;
    }
    return out;
  }

  /* ──────────────────────────────────────────────────────────────
     RENDER · PANELS
     ────────────────────────────────────────────────────────────── */
  function escAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
  function escText(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

  function renderResources(p, animate = false) {
    return RESOURCES.map(r => {
      const c = p.resources[r.key] || 0;
      return `
        <div class="res-tile ${r.key}${animate ? ' gain' : ''}" title="${escAttr(r.label + ' \u2014 ' + r.desc)}">
          <svg class="glyph" viewBox="-12 -12 24 24" aria-hidden="true">
            ${RES_GLYPH[r.key]}
          </svg>
          <div class="count mono-num">${c}</div>
          <div class="label">${r.short}</div>
        </div>`;
    }).join('');
  }

  function renderPlayerCards() {
    return game.players.map((p, i) => {
      const isAct = (isSetup() && i === game.setup.order[game.setup.step]) || (!isSetup() && i === game.currentPlayer);
      const cards = sumRes(p.resources);
      const handCount = p.hand.length;
      const vp = publicVp(p);
      const longestBadge = p.hasLongest ? '<span class="badge">Strongest&nbsp;Pathway</span>' : '';
      const careBadge = (game.mostTherapyOwner === p.id) ? '<span class="badge teal">Most&nbsp;Care</span>' : '';
      return `
        <div class="player-card ${isAct ? 'active' : ''}">
          <div class="between">
            <div class="row">
              <span class="swatch" style="background:${p.colorHex}"></span>
              <span class="name">${escText(p.name)}</span>

            <span class="pill mono-num">${vp} VP</span>
          </div>
          <div class="player-stats">
            <div class="stat"><div class="v mono-num">${p.clinics.length}</div><div class="k">Clinic</div></div>
            <div class="stat"><div class="v mono-num">${p.research.length}</div><div class="k">Resrch</div></div>
            <div class="stat"><div class="v mono-num">${p.pathways.length}</div><div class="k">Path</div></div>
            <div class="stat"><div class="v mono-num">${cards}</div><div class="k">Cards</div></div>

          <div class="tiny" style="margin-top:6px">

          ${(longestBadge || careBadge) ? `<div style="margin-top:6px">${longestBadge}${careBadge}</div>` : ''}
        </div>`;

  function costChips(cost) {
    return Object.entries(cost).filter(([, v]) => v > 0).map(([k, v]) =>
      `<span class="cost-chip ${k}">${v} ${R[k].short}</span>`
    ).join('');
  }

  function renderActionPanel() {
    const p = curPlayer();
    if (isSetup()) return setupPanel();
    if (game.moveFlareRequired || game.pendingAction === 'flareRoll' || game.pendingAction === 'flareCard')
      return flarePanel();
    if (game.pendingAction === 'discard') return discardPanel();
    if (game.pendingAction === 'steal')   return stealPanel();
    if (game.pendingAction === 'plenty')  return plentyPanel();
    if (game.pendingAction === 'monopoly') return monopolyPanel();

    const ready  = game.rolled && !game.moveFlareRequired && game.winner === null;
    const sel    = game.selectedCardIdx;
    const selCard= sel !== null && sel !== undefined ? p.hand[sel] : null;
    const selFresh = sel !== null && p.handFresh.includes(sel);

    const canPath   = ready && (canAfford(p, COSTS.pathway) || game.freePathways > 0) && validPathEdges(p.id).length > 0;
    const canClinic = ready && canAfford(p, COSTS.clinic)   && validClinicVerts(p.id).length > 0;
    const canResrc  = ready && canAfford(p, COSTS.research) && validResearchVerts(p.id).length > 0;
    const canBuy    = ready && canAfford(p, COSTS.therapy)  && game.deck.length > 0;
    const canPlay   = ready && selCard && !selFresh && game.pendingAction === null;

    const free = game.freePathways > 0;
    const action = (key, label, cost, ok, helper, tone='') => {
      const active = game.pendingAction === key;
      return `
        <div class="card" style="padding:10px 12px">
          <button class="btn full ${tone} ${active ? 'active' : ''}"
                  ${ok ? '' : 'disabled'}
                  onclick="G.setAction('${key}')">${label}</button>
          ${cost ? `<div class="cost-row" style="margin-top:8px">${costChips(cost)}</div>` : ''}
          <div class="tiny" style="margin-top:6px">${helper}</div>
        </div>`;
    };

    const pathHelp =
      free ? `Place ${game.freePathways} free pathway${game.freePathways === 1 ? '' : 's'}.` :
      canPath ? 'Click a glowing edge to place.' :
      !game.rolled ? 'Roll first.' :
      missingText(p, COSTS.pathway) || 'No legal placement.';
    const clinicHelp =
      canClinic ? 'Click a glowing intersection.' :
      !game.rolled ? 'Roll first.' :
      missingText(p, COSTS.clinic) || 'No legal placement (clinics can\u2019t touch each other and must connect to your pathway).';
    const resrcHelp =
      canResrc ? 'Click one of your clinics to upgrade it.' :
      !game.rolled ? 'Roll first.' :
      missingText(p, COSTS.research) || 'No clinic to upgrade.';

    return `
      <div class="stack">
        ${action('pathway',  free ? `Place free Pathway` : 'Build Pathway',  free ? null : COSTS.pathway,  canPath,   pathHelp)}
        ${action('clinic',  'Build Clinic',   COSTS.clinic,  canClinic, clinicHelp)}
        ${action('research','Upgrade to Research Center', COSTS.research, canResrc, resrcHelp, 'go')}

        <div class="card" style="padding:10px 12px">
          <button class="btn full gold" ${canBuy ? '' : 'disabled'} onclick="G.buyTherapy()">Buy Therapy Card</button>
          <div class="cost-row" style="margin-top:8px">${costChips(COSTS.therapy)}</div>
          <div class="tiny" style="margin-top:6px">
            ${canBuy ? `Draw 1 of ${game.deck.length} remaining.` :
              !game.rolled ? 'Roll first.' :
              missingText(p, COSTS.therapy) || 'Therapy deck is empty.'}
          </div>
        </div>

        <div class="card" style="padding:10px 12px">
          <button class="btn full primary" ${canPlay ? '' : 'disabled'} onclick="G.playSelected()">
            Play Selected Therapy
          </button>
          <div class="tiny" style="margin-top:6px">
            ${selCard ? (selFresh
                ? 'You drew this card this turn — you can play it next turn.'
                : selCard.effect)
              : 'Select a therapy card from your hand below.'}
          </div>
        </div>

        ${game.pendingAction ? `
          <button class="btn full ghost" onclick="G.cancelAction()">Cancel current action</button>
        ` : ''}
      </div>`;
  }

  function setupPanel() {
    const p = activePlayer();

    const stepNum = Math.min(game.setup.step + 1, game.setup.order.length);
    const total = game.setup.order.length;
    const isSecondHalf = game.setup.step >= game.players.length;
    return `
      <div class="card focus">
        <div class="between">
          <strong style="font-size:14px">Setup \u00b7 ${stepNum} of ${total}</strong>

    return `
      <div class="card warn">
        <div class="between">
          <strong style="font-size:14px">${isCurPlayer ? 'You owe' : escText(p.name) + ' owes'} a discard</strong>
          <span class="pill red">${totalPicked} / ${dc.owe}</span>
        </div>
        <div class="tiny" style="margin-top:8px">

        </div>
        <div class="discard-row" style="margin-top:10px">
          ${RESOURCES.map(r => `
            <div class="discard-cell">
              <div class="cost-chip ${r.key}">${p.resources[r.key]} ${r.short}</div>
              <div class="nudge">
                <button onclick="G.discardNudge('${r.key}', -1)" ${(dc.picks[r.key] || 0) === 0 ? 'disabled' : ''}>\u2212</button>

  function stealPanel() {

    return `

        <div class="row" style="margin-top:10px">

  function plentyPanel() {

        <div class="row" style="margin-top:10px">

            <button class="btn small" onclick="G.resolveMonopolyPick('${r.key}')">

      <div class="therapy-list">

    const tradeBtn = (side, kind) =>
      RESOURCES.map(r => {

          <span class="cost-chip ${r.key}">${r.short}</span>

        <div class="tiny" style="margin-top:4px">No production. The flare starts here.</div>
        <div class="tiny" style="margin-top:8px;line-height:1.55">

          They can <em>start</em> autoimmune disease, but chronic disease reflects failed tolerance afterward.
        </div>`;

      <div class="between">
        <div><strong>${escText(t.site)}</strong> <span class="tiny">\u00b7 ${R[t.type].label} tile</span></div>

  function statusBanner() {
    if (isSetup()) {
      const p = activePlayer();
      const placingClinic = game.setup.awaitingPathFromVertex === null;
      return {
        cls: 'status act',
        lead: `${p.name} \u2014 setup placement ${Math.min(game.setup.step + 1, game.setup.order.length)} of ${game.setup.order.length}`,
        desc: placingClinic
          ? 'Click a glowing intersection to place a clinic.'
          : 'Click a glowing edge next to your clinic to place its pathway.'
      };
    }
    if (game.winner !== null) {
      const w = game.players[game.winner];
      return { cls: 'status', lead: `${w.name} reached ${VICTORY_TARGET} VP!`, desc: 'Click "Play again" to start a new game.' };
    }
    if (game.moveFlareRequired || game.pendingAction === 'flareRoll' || game.pendingAction === 'flareCard') {
      return { cls: 'status req', lead: 'A flare is active — move it', desc: 'Click any tile on the board to relocate the flare marker.' };
    }
    if (game.pendingAction === 'discard') {
      const dc = game.discardCurrent;
      const name = dc ? game.players[dc.playerId].name : 'Player';
      return { cls: 'status req', lead: `${name} must discard`, desc: 'Use the +/\u2212 buttons to choose what to discard, then confirm.' };
    }
    if (game.pendingAction === 'steal') {
      return { cls: 'status act', lead: 'Choose a player to steal from', desc: 'The flare landed where multiple opponents have clinics.' };
    }
    if (game.pendingAction === 'plenty') {
      return { cls: 'status act', lead: 'Choose 2 resources', desc: 'Take any 2 resources from the bank.' };
    }
    if (game.pendingAction === 'monopoly') {
      return { cls: 'status act', lead: 'Choose 1 resource type', desc: 'You\u2019ll collect that type from every opponent.' };
    }
    if (game.pendingAction === 'pathway' || game.freePathways > 0) {
      return { cls: 'status act',
        lead: game.freePathways > 0 ? `Place ${game.freePathways} free pathway${game.freePathways === 1 ? '' : 's'}` : 'Place a pathway',
        desc: 'Click a glowing edge.' };
    }
    if (game.pendingAction === 'clinic')   return { cls: 'status act', lead: 'Place a clinic', desc: 'Click a glowing intersection.' };
    if (game.pendingAction === 'research') return { cls: 'status act', lead: 'Upgrade a clinic', desc: 'Click one of your clinics to upgrade it into a research center.' };
    if (!game.rolled) {
      return { cls: 'status', lead: `${curPlayer().name}\u2019s turn`, desc: 'Roll the dice to begin.' };
    }
    return { cls: 'status', lead: `${curPlayer().name}\u2019s turn`, desc: 'Build, trade, buy or play a therapy card, then end your turn.' };
  }

    const cls = game.diceRolling ? 'die rolling' : 'die';
    return `

        <span class="${cls}">${game.diceB ?? '\u2014'}</span>
        <span class="tiny mono-num" style="margin-left:6px">${game.dice ?? ''}</span>
