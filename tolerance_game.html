<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tolerance.io</title>
  <style>
    :root {
      --bg: #08111f;
      --panel: #101827;
      --panel-2: #182233;
      --panel-3: #22314b;
      --text: #e8edf5;
      --muted: #9fb1c7;
      --line: rgba(255,255,255,0.10);
      --accent: #38bdf8;
      --good: #34d399;
      --warn: #f59e0b;
      --bad: #f87171;
      --shadow: 0 14px 34px rgba(0,0,0,0.30);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: linear-gradient(180deg, #07101d 0%, #0b1423 100%); color: var(--text); font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, select { font: inherit; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 320px 1fr 360px; gap: 14px; padding: 14px; }
    .panel { background: rgba(16,24,39,0.93); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
    .header { padding: 14px 16px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,0.03); }
    .body { padding: 14px 16px; }
    .board-panel { display: grid; grid-template-rows: auto auto 1fr auto; min-height: calc(100vh - 28px); }
    .title { font-size: 28px; font-weight: 900; letter-spacing: -0.03em; }
    .title.small { font-size: 22px; }
    .subtitle { color: var(--muted); font-size: 14px; line-height: 1.45; margin-top: 6px; }
    .tiny { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .stack { display: grid; gap: 10px; }
    .card { background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
    .card.selected { outline: 2px solid rgba(56,189,248,0.35); }
    .pill { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.04); font-size: 12px; }
    .btn { border: 1px solid rgba(255,255,255,0.14); background: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04)); color: white; padding: 10px 12px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: transform .08s ease, border-color .2s ease; }
    .btn:hover { transform: translateY(-1px); border-color: rgba(255,255,255,0.24); }
    .btn:disabled { opacity: .42; cursor: not-allowed; transform: none; }
    .btn.primary { background: linear-gradient(180deg, rgba(56,189,248,0.30), rgba(14,165,233,0.14)); border-color: rgba(56,189,248,0.52); }
    .btn.good { background: linear-gradient(180deg, rgba(52,211,153,0.28), rgba(16,185,129,0.12)); border-color: rgba(52,211,153,0.50); }
    .btn.warn { background: linear-gradient(180deg, rgba(245,158,11,0.28), rgba(245,158,11,0.12)); border-color: rgba(245,158,11,0.50); }
    .btn.bad { background: linear-gradient(180deg, rgba(248,113,113,0.28), rgba(239,68,68,0.12)); border-color: rgba(248,113,113,0.50); }
    .btn.small { font-size: 12px; padding: 8px 10px; }
    .btn.active { outline: 2px solid rgba(56,189,248,0.35); }
    .resource-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .resource { border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); min-height: 72px; padding: 8px 6px; display: grid; align-content: center; gap: 4px; text-align: center; }
    .resource .count { font-size: 20px; font-weight: 900; }
    .resource .label { font-size: 10px; line-height: 1.2; }
    .player-card { background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
    .player-card.active { outline: 2px solid rgba(255,255,255,0.16); }
    .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
    .stat { background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; font-size: 12px; }
    .topbar { padding: 14px 16px 0; }
    .status { margin: 12px 16px 0; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--line); }
    .board-wrap { padding: 8px 10px 10px; display: grid; place-items: center; }
    svg { width: 100%; max-width: 980px; height: auto; }
    .hex { cursor: pointer; }
    .hex:hover { filter: brightness(1.05); }
    .edge { cursor: pointer; }
    .vertex { cursor: pointer; }
    .edge:hover, .vertex:hover { opacity: 1 !important; }
    .action-bar { padding: 0 16px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
    .token-grid { display: flex; gap: 8px; flex-wrap: wrap; }
    .token-btn { border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); color: white; padding: 8px 10px; font-size: 12px; font-weight: 700; cursor: pointer; background: rgba(255,255,255,0.05); }
    .token-btn.active { outline: 2px solid rgba(56,189,248,0.35); }
    .log { max-height: 220px; overflow: auto; display: grid; gap: 8px; }
    .log-item { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 10px; font-size: 13px; line-height: 1.42; }
    .legend-row { display: flex; gap: 10px; align-items: flex-start; }
    .swatch { width: 16px; height: 16px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.18); margin-top: 2px; flex-shrink: 0; }
    .modal-wrap { position: fixed; inset: 0; background: rgba(3,7,18,0.74); display: grid; place-items: center; padding: 20px; z-index: 10; }
    .modal { width: min(920px, 100%); max-height: calc(100vh - 40px); overflow: auto; background: linear-gradient(180deg, rgba(16,24,39,0.98), rgba(11,20,35,0.98)); border-radius: 24px; border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 24px 60px rgba(0,0,0,0.42); }
    .modal .content { padding: 20px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .start-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
    .name-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .input { width: 100%; min-height: 42px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,0.05); color: white; padding: 10px 12px; }
    .section-title { font-size: 15px; font-weight: 800; }
    .footer-note { padding: 10px 16px 16px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    @media (max-width: 1180px) {
      .app { grid-template-columns: 1fr; }
      .board-panel { min-height: auto; }
      .two-col, .start-grid, .name-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
  (() => {
    const RESOURCES = [
      { key: 'cytokine', short: 'CY', label: 'Cytokine', color: '#ef4444', tile: '#7f1d1d', desc: 'Inflammatory signals. Many autoimmune drugs work by blocking dominant cytokines such as TNF, IL-6, or IL-17.' },
      { key: 'bcell', short: 'BC', label: 'B-Cell', color: '#f59e0b', tile: '#7c4a03', desc: 'B cells can make autoantibodies and help drive inflammation.' },
      { key: 'tcell', short: 'TC', label: 'T-Cell', color: '#3b82f6', tile: '#1e40af', desc: 'T cells can coordinate immune responses and directly contribute to tissue damage.' },
      { key: 'myeloid', short: 'MY', label: 'Myeloid', color: '#8b5cf6', tile: '#5b21b6', desc: 'Dendritic cells and macrophages can either amplify inflammation or help restore tolerance.' },
      { key: 'tolerance', short: 'TL', label: 'Tolerance', color: '#10b981', tile: '#065f46', desc: 'Tolerance is the immune system’s ability to avoid attacking the body itself.' },
    ];
    const RESOURCE_KEYS = RESOURCES.map(r => r.key);
    const R = Object.fromEntries(RESOURCES.map(r => [r.key, r]));
    const PLAYER_COLORS = ['#22c55e', '#f97316', '#60a5fa', '#f472b6'];
    const DEFAULT_NAMES = ['Green', 'Orange', 'Blue', 'Pink'];
    const TISSUES = ['Joint', 'Skin', 'Gut', 'Brain', 'Pancreas', 'Kidney', 'Lung', 'Liver', 'Blood', 'Lymph', 'Synovium', 'Nerve', 'Eye', 'Muscle', 'Colon', 'Thyroid', 'Vessel', 'Bone Marrow', 'Spleen'];
    const NUMBER_TOKENS = [5, 2, 6, 3, 8, 10, 9, 12, 11, 4, 8, 10, 9, 4, 5, 6, 3, 11];
    const VICTORY_TARGET = 10;
    const COSTS = {
      road: { tcell: 1, myeloid: 1 },
      settlement: { bcell: 1, tcell: 1, myeloid: 1, tolerance: 1 },
      city: { cytokine: 3, bcell: 2 },
      therapy: { cytokine: 1, bcell: 1, tcell: 1, tolerance: 1 },
    };
    const THERAPY_TEMPLATE = [
      ...Array.from({length: 5}, () => ({ kind: 'blockade', title: 'Anti-Cytokine Therapy', effect: 'Move the flare to any tile and steal 1 random resource from a nearby opponent, if possible.', learn: 'This stands in for therapies that block dominant inflammatory cytokines.' })),
      ...Array.from({length: 4}, () => ({ kind: 'monopoly', title: 'B-Cell Depletion', effect: 'Choose 1 resource type. Take all cards of that type from all opponents.', learn: 'This stands in for therapies that strongly disrupt B-cell-driven disease.' })),
      ...Array.from({length: 4}, () => ({ kind: 'plenty', title: 'Low-Dose IL-2 / Treg Boost', effect: 'Take any 2 resources from the bank.', learn: 'This represents tolerance-restoring strategies that expand regulatory T cells.' })),
      ...Array.from({length: 3}, () => ({ kind: 'roads', title: 'T-Cell Pathway Planning', effect: 'Build 2 free pathways.', learn: 'This represents therapies that reshape T-cell signaling or activation pathways.' })),
      ...Array.from({length: 3}, () => ({ kind: 'plenty', title: 'Tolerogenic APC Reset', effect: 'Take any 2 resources from the bank.', learn: 'This represents myeloid and tolerogenic APC strategies that try to re-educate the immune system.' })),
      ...Array.from({length: 5}, () => ({ kind: 'vp', title: 'Precision Breakthrough', effect: 'Hidden 1 victory point.', learn: 'The field is moving toward more precise, durable immune recalibration.' })),
    ];

    const app = document.getElementById('app');

    function clone(x) { return JSON.parse(JSON.stringify(x)); }
    function resourceBlank() { return Object.fromEntries(RESOURCE_KEYS.map(k => [k, 0])); }
    function sumResources(resources) { return RESOURCE_KEYS.reduce((n, k) => n + (resources[k] || 0), 0); }
    function canAfford(player, cost) { return RESOURCE_KEYS.every(k => (player.resources[k] || 0) >= (cost[k] || 0)); }
    function spend(player, cost) { RESOURCE_KEYS.forEach(k => { player.resources[k] -= cost[k] || 0; }); }
    function add(target, delta) { RESOURCE_KEYS.forEach(k => { target[k] = (target[k] || 0) + (delta[k] || 0); }); }
    function round2(n) { return Math.round(n * 100) / 100; }
    function shuffle(array, seed = Math.random()) {
      const a = array.slice();
      let s = Math.floor(seed * 2147483647) || 1;
      const rnd = () => (s = s * 16807 % 2147483647) / 2147483647;
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(rnd() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function axialToPixel(q, r, size) {
      return { x: size * Math.sqrt(3) * (q + r / 2), y: size * 1.5 * r };
    }
    function getHexCorners(center, size) {
      const out = [];
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 180) * (60 * i - 30);
        out.push({ x: round2(center.x + size * Math.cos(angle)), y: round2(center.y + size * Math.sin(angle)) });
      }
      return out;
    }
    function randomResource(player) {
      const pool = [];
      RESOURCE_KEYS.forEach(k => { for (let i = 0; i < player.resources[k]; i++) pool.push(k); });
      if (!pool.length) return null;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function createPlayers(count, names) {
      return Array.from({length: count}, (_, i) => ({
        id: i,
        name: (names[i] || DEFAULT_NAMES[i]).trim() || DEFAULT_NAMES[i],
        color: PLAYER_COLORS[i],
        resources: resourceBlank(),
        settlements: [],
        cities: [],
        roads: [],
        therapyHand: [],
        hiddenVp: 0,
        playedTherapies: 0,
      }));
    }

    function createBoard() {
      const size = 66;
      const coords = [];
      for (let q = -2; q <= 2; q++) {
        const r1 = Math.max(-2, -q - 2);
        const r2 = Math.min(2, -q + 2);
        for (let r = r1; r <= r2; r++) coords.push({ q, r });
      }
      const types = shuffle([
        'cytokine','cytokine','cytokine','cytokine',
        'bcell','bcell','bcell','bcell',
        'tcell','tcell','tcell','tcell',
        'myeloid','myeloid','myeloid',
        'tolerance','tolerance','tolerance',
        'trigger'
      ]);
      const numbers = NUMBER_TOKENS.slice();
      const tiles = coords.map((coord, i) => {
        const center = axialToPixel(coord.q, coord.r, size);
        const type = types[i];
        return {
          id: i,
          q: coord.q,
          r: coord.r,
          x: center.x,
          y: center.y,
          size,
          tissue: TISSUES[i],
          type,
          number: type === 'trigger' ? null : numbers.shift(),
          corners: getHexCorners(center, size),
          vertexIds: [],
        };
      });

      const vertexMap = new Map();
      const edgeMap = new Map();

      function getVertex(pt) {
        const key = `${pt.x},${pt.y}`;
        if (!vertexMap.has(key)) {
          vertexMap.set(key, { id: vertexMap.size, x: pt.x, y: pt.y, tiles: [], neighbors: new Set(), occupant: null });
        }
        return vertexMap.get(key);
      }

      tiles.forEach(tile => {
        tile.corners.forEach(pt => {
          const v = getVertex(pt);
          v.tiles.push(tile.id);
          tile.vertexIds.push(v.id);
        });
        for (let i = 0; i < 6; i++) {
          const a = tile.vertexIds[i];
          const b = tile.vertexIds[(i + 1) % 6];
          const low = Math.min(a, b), high = Math.max(a, b);
          const vertices = Array.from(vertexMap.values());
          vertices[low]?.neighbors.add(high);
          vertices[high]?.neighbors.add(low);
          const key = `${low}-${high}`;
          if (!edgeMap.has(key)) edgeMap.set(key, { id: edgeMap.size, v1: low, v2: high, owner: null, tiles: [] });
          edgeMap.get(key).tiles.push(tile.id);
        }
      });

      return {
        tiles,
        vertices: Array.from(vertexMap.values()).map(v => ({ ...v, neighbors: Array.from(v.neighbors) })),
        edges: Array.from(edgeMap.values()),
      };
    }

    function setupOrderFor(count) {
      const a = Array.from({length: count}, (_, i) => i);
      return a.concat(a.slice().reverse());
    }

    function createGame(count = 4, names = DEFAULT_NAMES) {
      const board = createBoard();
      const players = createPlayers(count, names);
      return {
        board,
        players,
        currentPlayer: 0,
        turn: 1,
        dice: null,
        rolled: false,
        flareTileId: board.tiles.find(t => t.type === 'trigger').id,
        selectedTileId: null,
        selectedCardIndex: null,
        infoText: 'Place your starting clinics and pathways. Clinics must not touch each other.',
        log: ['Welcome to Tolerance.io. This game teaches that autoimmunity is misdirected immunity, not simply “too much” immunity.'],
        pendingAction: null,
        freeRoads: 0,
        tempPick: [],
        tempCardTitle: null,
        waitingMonopolyCard: null,
        waitingBlockadeCard: null,
        moveFlareRequired: false,
        winner: null,
        deck: shuffle(THERAPY_TEMPLATE),
        bank: { cytokine: 19, bcell: 19, tcell: 19, myeloid: 19, tolerance: 19 },
        trade: { give: 'cytokine', get: 'tolerance' },
        mostPreparedOwner: null,
        helpOpen: false,
        setup: {
          order: setupOrderFor(count),
          step: 0,
          awaitingRoadFromVertex: null,
        },
        showStart: false,
      };
    }

    let game = null;
    let startConfig = { count: 4, names: DEFAULT_NAMES.slice(0, 4) };
    let showStartModal = true;
    let showRulesModal = false;

    function log(msg) {
      game.log.unshift(msg);
      game.log = game.log.slice(0, 18);
    }
    function currentPlayer() { return game.players[game.currentPlayer]; }
    function isSetup() { return game.setup.step < game.setup.order.length; }

    function adjacentEdges(vertexId) {
      return game.board.edges.filter(e => e.v1 === vertexId || e.v2 === vertexId);
    }
    function playerOwnsAdjacentRoad(playerId, vertexId) {
      return adjacentEdges(vertexId).some(e => e.owner === playerId);
    }
    function canBuildSettlementAt(playerId, vertexId, duringSetup = false) {
      const vertex = game.board.vertices[vertexId];
      if (vertex.occupant) return false;
      for (const n of vertex.neighbors) if (game.board.vertices[n].occupant) return false;
      if (duringSetup) return true;
      return playerOwnsAdjacentRoad(playerId, vertexId);
    }
    function canBuildRoadAt(playerId, edgeId, duringSetup = false) {
      const edge = game.board.edges[edgeId];
      if (edge.owner !== null) return false;
      if (duringSetup) {
        const anchor = game.setup.awaitingRoadFromVertex;
        return anchor !== null && (edge.v1 === anchor || edge.v2 === anchor);
      }
      const v1 = game.board.vertices[edge.v1];
      const v2 = game.board.vertices[edge.v2];
      return [v1, v2].some(v => (v.occupant && v.occupant.playerId === playerId) || playerOwnsAdjacentRoad(playerId, v.id));
    }
    function validRoadsForPlayer(playerId) {
      return game.board.edges.filter(e => canBuildRoadAt(playerId, e.id, false)).map(e => e.id);
    }
    function validSettlementsForPlayer(playerId) {
      return game.board.vertices.filter(v => canBuildSettlementAt(playerId, v.id, false)).map(v => v.id);
    }
    function validCitiesForPlayer(playerId) {
      return game.board.vertices.filter(v => v.occupant && v.occupant.playerId === playerId && v.occupant.type === 'settlement').map(v => v.id);
    }

    function updateMostPrepared() {
      let owner = null;
      let best = 2;
      let tie = false;
      game.players.forEach(p => {
        if (p.playedTherapies > best) {
          best = p.playedTherapies;
          owner = p.id;
          tie = false;
        } else if (p.playedTherapies === best && best >= 3) {
          tie = true;
        }
      });
      game.mostPreparedOwner = tie ? null : owner;
    }
    function victoryPoints(p) {
      let vp = p.settlements.length + p.cities.length * 2 + p.hiddenVp;
      if (game.mostPreparedOwner === p.id) vp += 2;
      return vp;
    }
    function checkWinner() {
      for (const p of game.players) {
        if (victoryPoints(p) >= VICTORY_TARGET) {
          game.winner = p.id;
          return;
        }
      }
    }

    function placeSettlement(playerId, vertexId, city = false) {
      const vertex = game.board.vertices[vertexId];
      vertex.occupant = { playerId, type: city ? 'city' : 'settlement' };
      const p = game.players[playerId];
      if (city) {
        p.settlements = p.settlements.filter(v => v !== vertexId);
        p.cities.push(vertexId);
      } else {
        p.settlements.push(vertexId);
      }
    }
    function placeRoad(playerId, edgeId) {
      game.board.edges[edgeId].owner = playerId;
      game.players[playerId].roads.push(edgeId);
    }
    function grantInitialResources(playerId, vertexId) {
      const p = game.players[playerId];
      game.board.vertices[vertexId].tiles.forEach(tileId => {
        const tile = game.board.tiles[tileId];
        if (tile.type !== 'trigger' && game.bank[tile.type] > 0) {
          p.resources[tile.type] += 1;
          game.bank[tile.type] -= 1;
        }
      });
    }

    function setupClickVertex(vertexId) {
      const playerId = game.setup.order[game.setup.step];
      if (!canBuildSettlementAt(playerId, vertexId, true)) return;
      placeSettlement(playerId, vertexId, false);
      game.setup.awaitingRoadFromVertex = vertexId;
      game.infoText = 'Now place 1 adjacent pathway connected to that clinic.';
      log(`${game.players[playerId].name} placed a starting clinic.`);
      render();
    }
    function setupClickEdge(edgeId) {
      const playerId = game.setup.order[game.setup.step];
      if (!canBuildRoadAt(playerId, edgeId, true)) return;
      placeRoad(playerId, edgeId);
      if (game.setup.step >= game.players.length) grantInitialResources(playerId, game.setup.awaitingRoadFromVertex);
      game.setup.awaitingRoadFromVertex = null;
      game.setup.step += 1;
      if (!isSetup()) {
        game.currentPlayer = 0;
        game.infoText = 'Setup complete. Roll the dice to begin.';
        log('Setup complete. Green starts.');
      } else {
        const next = game.setup.order[game.setup.step];
        game.infoText = `${game.players[next].name}: place 1 clinic, then 1 adjacent pathway.`;
      }
      render();
    }

    function produceResources(roll) {
      game.board.tiles.forEach(tile => {
        if (tile.number !== roll || tile.id === game.flareTileId || tile.type === 'trigger') return;
        tile.vertexIds.forEach(vId => {
          const occ = game.board.vertices[vId].occupant;
          if (!occ) return;
          const amount = occ.type === 'city' ? 2 : 1;
          const available = Math.min(amount, game.bank[tile.type]);
          if (available > 0) {
            game.players[occ.playerId].resources[tile.type] += available;
            game.bank[tile.type] -= available;
          }
        });
      });
    }

    function discardOnSeven() {
      game.players.forEach(p => {
        let total = sumResources(p.resources);
        if (total <= 7) return;
        let toDiscard = Math.floor(total / 2);
        while (toDiscard > 0) {
          const res = randomResource(p);
          if (!res) break;
          p.resources[res] -= 1;
          game.bank[res] += 1;
          toDiscard -= 1;
        }
        log(`${p.name} discarded down after a flare surge.`);
      });
    }

    function ownersAdjacentToTile(tileId, excluding = null) {
      const out = new Set();
      game.board.tiles[tileId].vertexIds.forEach(vId => {
        const occ = game.board.vertices[vId].occupant;
        if (occ && occ.playerId !== excluding) out.add(occ.playerId);
      });
      return Array.from(out);
    }
    function stealNearTile(tileId, stealerId) {
      const candidates = ownersAdjacentToTile(tileId, stealerId).filter(pid => sumResources(game.players[pid].resources) > 0);
      if (!candidates.length) return null;
      const targetId = candidates[Math.floor(Math.random() * candidates.length)];
      const res = randomResource(game.players[targetId]);
      if (!res) return null;
      game.players[targetId].resources[res] -= 1;
      game.players[stealerId].resources[res] += 1;
      return { targetId, res };
    }

    function rollDice() {
      if (isSetup() || game.rolled || game.winner !== null) return;
      const roll = 1 + Math.floor(Math.random() * 6) + 1 + Math.floor(Math.random() * 6);
      game.rolled = true;
      game.dice = roll;
      log(`${currentPlayer().name} rolled ${roll}.`);
      if (roll === 7) {
        discardOnSeven();
        game.moveFlareRequired = true;
        game.pendingAction = 'moveFlare';
        game.infoText = 'A flare was rolled. Click any tile to move the flare marker there.';
      } else {
        produceResources(roll);
        game.infoText = `Tiles with ${roll} produced resources unless they were blocked by the flare.`;
      }
      render();
    }

    function moveFlare(tileId, fromCard = false) {
      game.flareTileId = tileId;
      const steal = stealNearTile(tileId, game.currentPlayer);
      if (steal) log(`${currentPlayer().name} took 1 ${R[steal.res].short} from ${game.players[steal.targetId].name}.`);
      if (fromCard) {
        const idx = game.waitingBlockadeCard;
        const player = currentPlayer();
        const card = player.therapyHand[idx];
        if (card) {
          player.therapyHand.splice(idx, 1);
          player.playedTherapies += 1;
          updateMostPrepared();
          log(`${player.name} played ${card.title}.`);
          game.infoText = card.learn;
        }
        game.waitingBlockadeCard = null;
      } else {
        log(`${currentPlayer().name} moved the flare to ${game.board.tiles[tileId].tissue}.`);
        game.infoText = 'The flare now blocks that tile from producing resources.';
      }
      game.moveFlareRequired = false;
      game.pendingAction = null;
      checkWinner();
      render();
    }

    function buildRoad(edgeId, free = false) {
      const p = currentPlayer();
      if (!canBuildRoadAt(p.id, edgeId, false)) return;
      if (!free) {
        if (!canAfford(p, COSTS.road)) return;
        spend(p, COSTS.road);
        add(game.bank, COSTS.road);
      }
      placeRoad(p.id, edgeId);
      log(`${p.name} built a pathway.`);
      if (game.freeRoads > 0) {
        game.freeRoads -= 1;
        if (game.freeRoads === 0) game.pendingAction = null;
      } else {
        game.pendingAction = null;
      }
      checkWinner();
      render();
    }

    function buildSettlement(vertexId) {
      const p = currentPlayer();
      if (!canBuildSettlementAt(p.id, vertexId, false)) return;
      if (!canAfford(p, COSTS.settlement)) return;
      spend(p, COSTS.settlement);
      add(game.bank, COSTS.settlement);
      placeSettlement(p.id, vertexId, false);
      log(`${p.name} built a clinic.`);
      game.pendingAction = null;
      checkWinner();
      render();
    }

    function upgradeCity(vertexId) {
      const p = currentPlayer();
      const occ = game.board.vertices[vertexId].occupant;
      if (!occ || occ.playerId !== p.id || occ.type !== 'settlement') return;
      if (!canAfford(p, COSTS.city)) return;
      spend(p, COSTS.city);
      add(game.bank, COSTS.city);
      placeSettlement(p.id, vertexId, true);
      log(`${p.name} upgraded a clinic into a research center.`);
      game.pendingAction = null;
      checkWinner();
      render();
    }

    function buyTherapy() {
      const p = currentPlayer();
      if (isSetup() || !game.rolled || game.moveFlareRequired || game.winner !== null) return;
      if (!canAfford(p, COSTS.therapy) || !game.deck.length) return;
      spend(p, COSTS.therapy);
      add(game.bank, COSTS.therapy);
      const card = game.deck.pop();
      if (card.kind === 'vp') {
        p.hiddenVp += 1;
        log(`${p.name} gained a hidden Precision Breakthrough.`);
        game.infoText = card.learn;
      } else {
        p.therapyHand.push(card);
        log(`${p.name} drew ${card.title}.`);
        game.infoText = card.learn;
      }
      checkWinner();
      render();
    }

    function playTherapy() {
      const p = currentPlayer();
      const idx = game.selectedCardIndex;
      if (idx === null || idx === undefined) return;
      const card = p.therapyHand[idx];
      if (!card) return;
      if (card.kind === 'roads') {
        p.therapyHand.splice(idx, 1);
        p.playedTherapies += 1;
        updateMostPrepared();
        game.freeRoads = 2;
        game.pendingAction = 'road';
        game.selectedCardIndex = null;
        log(`${p.name} played ${card.title} and may build 2 free pathways.`);
        game.infoText = card.learn;
      } else if (card.kind === 'plenty') {
        game.pendingAction = 'takeTwo';
        game.tempPick = [];
        game.tempCardTitle = card.title;
        game.infoText = card.learn + ' Choose 2 resources below.';
      } else if (card.kind === 'monopoly') {
        game.pendingAction = 'monopoly';
        game.waitingMonopolyCard = idx;
        game.infoText = card.learn + ' Choose 1 resource type.';
      } else if (card.kind === 'blockade') {
        game.pendingAction = 'moveFlareByCard';
        game.waitingBlockadeCard = idx;
        game.infoText = card.learn + ' Click the destination tile.';
      }
      render();
    }

    function resolvePlenty(resourceKey) {
      if (game.pendingAction !== 'takeTwo') return;
      const p = currentPlayer();
      if (game.bank[resourceKey] <= 0) return;
      p.resources[resourceKey] += 1;
      game.bank[resourceKey] -= 1;
      game.tempPick.push(resourceKey);
      if (game.tempPick.length >= 2) {
        const idx = p.therapyHand.findIndex(c => c.title === game.tempCardTitle && c.kind === 'plenty');
        if (idx >= 0) {
          const card = p.therapyHand[idx];
          p.therapyHand.splice(idx, 1);
          p.playedTherapies += 1;
          updateMostPrepared();
          log(`${p.name} played ${card.title} and took ${R[game.tempPick[0]].short} and ${R[game.tempPick[1]].short}.`);
          game.infoText = card.learn;
        }
        game.pendingAction = null;
        game.tempPick = [];
        game.tempCardTitle = null;
      }
      render();
    }

    function resolveMonopoly(resourceKey) {
      if (game.pendingAction !== 'monopoly') return;
      const p = currentPlayer();
      const idx = game.waitingMonopolyCard;
      const card = p.therapyHand[idx];
      if (!card) return;
      let gained = 0;
      game.players.forEach(other => {
        if (other.id === p.id) return;
        gained += other.resources[resourceKey];
        p.resources[resourceKey] += other.resources[resourceKey];
        other.resources[resourceKey] = 0;
      });
      p.therapyHand.splice(idx, 1);
      p.playedTherapies += 1;
      updateMostPrepared();
      game.waitingMonopolyCard = null;
      game.pendingAction = null;
      game.selectedCardIndex = null;
      log(`${p.name} played ${card.title} and collected ${gained} ${R[resourceKey].short}.`);
      game.infoText = card.learn;
      render();
    }

    function doTrade() {
      const p = currentPlayer();
      const { give, get } = game.trade;
      if (give === get) return;
      if (p.resources[give] < 4 || game.bank[get] < 1) return;
      p.resources[give] -= 4;
      game.bank[give] += 4;
      p.resources[get] += 1;
      game.bank[get] -= 1;
      log(`${p.name} traded 4 ${R[give].short} for 1 ${R[get].short}.`);
      render();
    }

    function endTurn() {
      if (isSetup() || game.moveFlareRequired || game.winner !== null) return;
      game.pendingAction = null;
      game.selectedCardIndex = null;
      game.waitingMonopolyCard = null;
      game.waitingBlockadeCard = null;
      game.tempPick = [];
      game.tempCardTitle = null;
      game.freeRoads = 0;
      game.rolled = false;
      game.dice = null;
      game.currentPlayer = (game.currentPlayer + 1) % game.players.length;
      if (game.currentPlayer === 0) game.turn += 1;
      game.infoText = 'Roll the dice to produce resources.';
      log(`Turn ${game.turn}: ${currentPlayer().name} begins.`);
      render();
    }

    function setAction(action) {
      if (game.moveFlareRequired) return;
      game.pendingAction = game.pendingAction === action ? null : action;
      game.selectedCardIndex = null;
      const notes = {
        road: 'Click a highlighted empty edge to build a pathway.',
        settlement: 'Click a highlighted intersection to build a clinic.',
        city: 'Click one of your clinics to upgrade it into a research center.',
      };
      game.infoText = notes[action] || 'Choose an action.';
      render();
    }

    function clickTile(tileId) {
      game.selectedTileId = tileId;
      const tile = game.board.tiles[tileId];
      if (game.pendingAction === 'moveFlare' && game.moveFlareRequired) return moveFlare(tileId, false);
      if (game.pendingAction === 'moveFlareByCard') return moveFlare(tileId, true);
      game.infoText = tile.type === 'trigger'
        ? `${tile.tissue}: Trigger tile. Genetics and environment can help start disease, but chronic autoimmunity reflects failed tolerance.`
        : `${tile.tissue}: ${R[tile.type].desc} This tile activates on ${tile.number}.`;
      render();
    }
    function clickVertex(vertexId) {
      if (isSetup()) {
        if (game.setup.awaitingRoadFromVertex === null) return setupClickVertex(vertexId);
        return;
      }
      if (game.pendingAction === 'settlement') return buildSettlement(vertexId);
      if (game.pendingAction === 'city') return upgradeCity(vertexId);
      const occ = game.board.vertices[vertexId].occupant;
      if (occ) game.infoText = `${game.players[occ.playerId].name} has a ${occ.type === 'city' ? 'research center' : 'clinic'} here.`;
      render();
    }
    function clickEdge(edgeId) {
      if (isSetup()) {
        if (game.setup.awaitingRoadFromVertex !== null) return setupClickEdge(edgeId);
        return;
      }
      if (game.pendingAction === 'road' || game.freeRoads > 0) return buildRoad(edgeId, game.freeRoads > 0);
      game.infoText = 'Pathways connect your clinics and research centers.';
      render();
    }

    function startGame() {
      const count = startConfig.count;
      const names = startConfig.names.slice(0, count);
      game = createGame(count, names);
      showStartModal = false;
      showRulesModal = false;
      render();
    }

    function selectCard(idx) {
      game.selectedCardIndex = game.selectedCardIndex === idx ? null : idx;
      const card = currentPlayer().therapyHand[idx];
      if (card) game.infoText = `${card.effect} ${card.learn}`;
      render();
    }

    function tileFill(tile) {
      return tile.type === 'trigger' ? '#374151' : R[tile.type].tile;
    }
    function tileLabel(tile) {
      return tile.type === 'trigger' ? 'Trigger' : R[tile.type].short;
    }

    function validSets() {
      if (!game) return { roads: new Set(), settlements: new Set(), cities: new Set(), setupVertices: new Set(), setupEdges: new Set() };
      const pid = currentPlayer().id;
      const roads = new Set((game.pendingAction === 'road' || game.freeRoads > 0) ? validRoadsForPlayer(pid) : []);
      const settlements = new Set(game.pendingAction === 'settlement' ? validSettlementsForPlayer(pid) : []);
      const cities = new Set(game.pendingAction === 'city' ? validCitiesForPlayer(pid) : []);
      const setupVertices = new Set(isSetup() && game.setup.awaitingRoadFromVertex === null ? game.board.vertices.filter(v => canBuildSettlementAt(game.setup.order[game.setup.step], v.id, true)).map(v => v.id) : []);
      const setupEdges = new Set(isSetup() && game.setup.awaitingRoadFromVertex !== null ? game.board.edges.filter(e => canBuildRoadAt(game.setup.order[game.setup.step], e.id, true)).map(e => e.id) : []);
      return { roads, settlements, cities, setupVertices, setupEdges };
    }

    function renderBoard() {
      const tiles = game.board.tiles;
      const xs = tiles.flatMap(t => t.corners.map(c => c.x));
      const ys = tiles.flatMap(t => t.corners.map(c => c.y));
      const minX = Math.min(...xs) - 110, minY = Math.min(...ys) - 110;
      const width = Math.max(...xs) - Math.min(...xs) + 220;
      const height = Math.max(...ys) - Math.min(...ys) + 220;
      const valid = validSets();
      const tileSvg = tiles.map(tile => {
        const points = tile.corners.map(c => `${c.x},${c.y}`).join(' ');
        const flare = tile.id === game.flareTileId;
        const selected = game.selectedTileId === tile.id;
        return `
          <g class="hex" onclick="G.clickTile(${tile.id})" style="opacity:${selected ? 1 : 0.98}">
            <polygon points="${points}" fill="${tileFill(tile)}" stroke="${selected ? 'white' : 'rgba(255,255,255,0.16)'}" stroke-width="${selected ? 4 : 2}"></polygon>
            <text x="${tile.x}" y="${tile.y - 12}" text-anchor="middle" font-size="14" font-weight="800" fill="white">${tile.tissue}</text>
            <text x="${tile.x}" y="${tile.y + 8}" text-anchor="middle" font-size="24" font-weight="900" fill="white">${tileLabel(tile)}</text>
            ${tile.number ? `<circle cx="${tile.x}" cy="${tile.y + 34}" r="18" fill="rgba(255,255,255,0.93)"></circle><text x="${tile.x}" y="${tile.y + 40}" text-anchor="middle" font-size="18" font-weight="900" fill="#0f172a">${tile.number}</text>` : ''}
            ${flare ? `<circle cx="${tile.x + 44}" cy="${tile.y - 38}" r="18" fill="#ef4444"></circle><text x="${tile.x + 44}" y="${tile.y - 32}" text-anchor="middle" font-size="18" font-weight="900" fill="white">!</text>` : ''}
          </g>`;
      }).join('');
      const edgeSvg = game.board.edges.map(edge => {
        const a = game.board.vertices[edge.v1], b = game.board.vertices[edge.v2];
        const owner = edge.owner !== null ? game.players[edge.owner] : null;
        const isValid = valid.roads.has(edge.id) || valid.setupEdges.has(edge.id);
        const stroke = owner ? owner.color : (isValid ? 'rgba(56,189,248,0.72)' : 'rgba(255,255,255,0.15)');
        const sw = owner ? 8 : (isValid ? 8 : 4);
        const opacity = owner || isValid ? 1 : 0.85;
        return `<line class="edge" onclick="G.clickEdge(${edge.id})" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" opacity="${opacity}"></line>`;
      }).join('');
      const vertexSvg = game.board.vertices.map(v => {
        const occ = v.occupant;
        const isValid = valid.settlements.has(v.id) || valid.cities.has(v.id) || valid.setupVertices.has(v.id);
        if (!occ) {
          return `<g class="vertex" onclick="G.clickVertex(${v.id})"><circle cx="${v.x}" cy="${v.y}" r="${isValid ? 7 : 5}" fill="${isValid ? 'rgba(56,189,248,0.85)' : 'rgba(255,255,255,0.55)'}"></circle></g>`;
        }
        const p = game.players[occ.playerId];
        if (occ.type === 'settlement') {
          const s = 11;
          const pts = `${v.x},${v.y-s} ${v.x+s},${v.y-1} ${v.x+s},${v.y+s} ${v.x-s},${v.y+s} ${v.x-s},${v.y-1}`;
          const selected = valid.cities.has(v.id);
          return `<g class="vertex" onclick="G.clickVertex(${v.id})"><polygon points="${pts}" fill="${p.color}" stroke="${selected ? '#38bdf8' : 'white'}" stroke-width="${selected ? 3 : 2}"></polygon></g>`;
        }
        const s = 13;
        return `<g class="vertex" onclick="G.clickVertex(${v.id})"><rect x="${v.x-s}" y="${v.y-s}" width="${s*2}" height="${s*2}" rx="4" fill="${p.color}" stroke="white" stroke-width="2"></rect><rect x="${v.x-8}" y="${v.y-24}" width="16" height="14" rx="3" fill="${p.color}" stroke="white" stroke-width="2"></rect></g>`;
      }).join('');

      return `<svg viewBox="${minX} ${minY} ${width} ${height}">${tileSvg}${edgeSvg}${vertexSvg}</svg>`;
    }

    function renderPlayers() {
      return game.players.map((p, i) => `
        <div class="player-card ${i === game.currentPlayer && !isSetup() ? 'active' : ''}">
          <div class="between"><div class="row"><span class="dot" style="background:${p.color}"></span><strong>${p.name}</strong></div><span class="pill">${victoryPoints(p)} VP</span></div>
          <div class="stats">
            <div class="stat"><div>${p.settlements.length}</div><div class="tiny">Clinics</div></div>
            <div class="stat"><div>${p.cities.length}</div><div class="tiny">Research</div></div>
            <div class="stat"><div>${p.roads.length}</div><div class="tiny">Paths</div></div>
            <div class="stat"><div>${sumResources(p.resources)}</div><div class="tiny">Cards</div></div>
          </div>
          <div class="tiny" style="margin-top:8px">Therapies played: ${p.playedTherapies}${game.mostPreparedOwner === p.id ? ' • Most Prepared (+2 VP)' : ''}${p.hiddenVp ? ` • Hidden VP: ${p.hiddenVp}` : ''}</div>
        </div>`).join('');
    }

    function renderResources(p) {
      return RESOURCES.map(r => `<div class="resource" style="background:${r.color}20;border-color:${r.color}55"><div class="count">${p.resources[r.key]}</div><div class="label">${r.label}</div><div class="label">${r.short}</div></div>`).join('');
    }

    function renderHand() {
      const p = currentPlayer();
      if (!p.therapyHand.length) return '<div class="tiny">No therapy cards in hand yet.</div>';
      return p.therapyHand.map((c, i) => `<div class="card ${game.selectedCardIndex === i ? 'selected' : ''}" onclick="G.selectCard(${i})"><div class="between"><strong>${c.title}</strong><span class="pill">${c.kind}</span></div><div class="tiny" style="margin-top:6px">${c.effect}</div><div class="tiny" style="margin-top:8px;color:#cfe3f6">${c.learn}</div></div>`).join('');
    }

    function currentBannerTitle() {
      if (isSetup()) return `Setup: ${game.players[game.setup.order[game.setup.step]].name}`;
      return `${currentPlayer().name}'s turn`;
    }
    function currentBannerSubtitle() {
      if (isSetup()) return game.setup.awaitingRoadFromVertex === null ? 'Place 1 clinic' : 'Place 1 adjacent pathway';
      if (game.moveFlareRequired) return 'Resolve the flare';
      if (game.freeRoads > 0) return `Build ${game.freeRoads} free pathway${game.freeRoads === 1 ? '' : 's'}`;
      if (game.pendingAction === 'takeTwo') return 'Choose 2 resources';
      if (game.pendingAction === 'monopoly') return 'Choose 1 resource type';
      if (game.pendingAction === 'moveFlareByCard') return 'Choose the flare destination';
      return game.rolled ? 'Build, trade, buy cards, or end turn' : 'Roll the dice';
    }

    function tradeButtons(type) {
      return RESOURCES.map(r => `<button class="token-btn ${game.trade[type] === r.key ? 'active' : ''}" onclick="G.setTrade('${type}','${r.key}')" style="background:${r.color}1f;border-color:${r.color}66">${r.short}</button>`).join('');
    }

    function rulesModal() {
      return `
        <div class="modal-wrap" onclick="G.closeRules(event)">
          <div class="modal">
            <div class="header between"><div><div class="title small">How to play</div><div class="subtitle">A very short rulebook built into the game.</div></div><button class="btn" onclick="G.hideRules()">Close</button></div>
            <div class="content stack">
              <div class="card"><strong>Goal</strong><div class="tiny" style="margin-top:6px">Be the first player to reach <strong>10 victory points</strong>.</div></div>
              <div class="two-col">
                <div class="card"><strong>Turn</strong><div class="tiny" style="margin-top:6px">1. Roll dice.<br>2. Collect resources from matching tiles.<br>3. Build, trade, buy therapy cards, or play therapy cards.<br>4. End your turn.</div></div>
                <div class="card"><strong>Flare</strong><div class="tiny" style="margin-top:6px">If you roll a 7, everyone with more than 7 cards discards half. Then move the flare marker. That tile stops producing resources.</div></div>
              </div>
              <div class="card"><strong>Build costs</strong><div class="tiny" style="margin-top:6px">Pathway: 1 TC + 1 MY<br>Clinic: 1 BC + 1 TC + 1 MY + 1 TL<br>Research center: 3 CY + 2 BC<br>Therapy card: 1 CY + 1 BC + 1 TC + 1 TL</div></div>
              <div class="card"><strong>What the science means</strong><div class="tiny" style="margin-top:6px">Autoimmunity means the immune system attacks healthy tissue. Tolerance means the immune system correctly avoids attacking the body. The game’s main message is that better treatments aim to restore balance, not simply shut immunity off.</div></div>
            </div>
          </div>
        </div>`;
    }

    function startModal() {
      return `
        <div class="modal-wrap">
          <div class="modal">
            <div class="header"><div class="title">Tolerance.io</div><div class="subtitle">A browser game inspired by Catan that teaches autoimmunity for a general audience.</div></div>
            <div class="content stack">
              <div class="start-grid">
                <button class="btn ${startConfig.count === 3 ? 'active' : ''}" onclick="G.setPlayerCount(3)">3 players</button>
                <button class="btn ${startConfig.count === 4 ? 'active' : ''}" onclick="G.setPlayerCount(4)">4 players</button>
              </div>
              <div class="card">
                <div class="section-title">Player names</div>
                <div class="name-grid" style="margin-top:10px">
                  ${Array.from({length: startConfig.count}, (_, i) => `<input class="input" value="${(startConfig.names[i] || DEFAULT_NAMES[i]).replace(/"/g, '&quot;')}" oninput="G.setPlayerName(${i}, this.value)" />`).join('')}
                </div>
              </div>
              <div class="two-col">
                <div class="card">
                  <div class="section-title">What you do</div>
                  <div class="tiny" style="margin-top:8px">Roll dice, collect immune insight, build clinics and research centers, and use therapy cards to control flares.</div>
                </div>
                <div class="card">
                  <div class="section-title">What it teaches</div>
                  <div class="tiny" style="margin-top:8px">Autoimmune disease is misdirected immunity. Better therapies increasingly aim to restore tolerance and balance.</div>
                </div>
              </div>
              <div class="row">
                <button class="btn primary" onclick="G.startGame()">Start game</button>
                <button class="btn" onclick="G.showRules()">Read quick rules</button>
              </div>
            </div>
          </div>
        </div>`;
    }

    function render() {
      if (!game) {
        app.innerHTML = `${showStartModal ? startModal() : ''}${showRulesModal ? rulesModal() : ''}`;
        return;
      }
      const p = currentPlayer();
      const selectedTile = game.selectedTileId !== null ? game.board.tiles[game.selectedTileId] : null;
      app.innerHTML = `
        <div class="app">
          <div class="panel">
            <div class="header"><div class="title small">Tolerance.io</div><div class="subtitle">A simple strategy game about autoimmunity.</div></div>
            <div class="body stack">
              <div class="card">
                <div class="between"><strong>Quick guide</strong><button class="btn small" onclick="G.showRules()">Rules</button></div>
                <div class="tiny" style="margin-top:8px">Roll dice, collect resources, build pathways and clinics, upgrade into research centers, use therapy cards to manage flares, and reach 10 VP first.</div>
              </div>
              <div class="card">
                <strong>What the game teaches</strong>
                <div class="stack" style="margin-top:10px">
                  ${RESOURCES.map(r => `<div class="legend-row"><div class="swatch" style="background:${r.color}"></div><div><strong style="font-size:13px">${r.label}</strong><div class="tiny">${r.desc}</div></div></div>`).join('')}
                </div>
              </div>
              <div>
                <div class="between" style="margin-bottom:8px"><strong>Players</strong><span class="pill">First to ${VICTORY_TARGET} VP</span></div>
                <div class="stack">${renderPlayers()}</div>
              </div>
            </div>
          </div>

          <div class="panel board-panel">
            <div class="topbar between">
              <div><div class="title small">${currentBannerTitle()}</div><div class="subtitle">${currentBannerSubtitle()}</div></div>
              <div class="row"><button class="btn primary" onclick="G.rollDice()" ${isSetup() || game.rolled || game.winner !== null ? 'disabled' : ''}>Roll Dice</button><span class="pill">Dice: ${game.dice || '—'}</span><button class="btn" onclick="G.restart()">Restart</button></div>
            </div>
            <div class="status between"><div><strong>${p.name}</strong><div class="tiny" style="margin-top:4px">${game.infoText}</div></div><div class="pill">Flare: ${game.board.tiles[game.flareTileId].tissue}</div></div>
            <div class="board-wrap">${renderBoard()}</div>
            <div class="action-bar">
              <button class="btn ${game.pendingAction === 'road' ? 'active' : ''}" onclick="G.setAction('road')" ${!game.rolled || game.moveFlareRequired || game.winner !== null ? 'disabled' : ''}>Build Pathway</button>
              <button class="btn ${game.pendingAction === 'settlement' ? 'active' : ''}" onclick="G.setAction('settlement')" ${!game.rolled || game.moveFlareRequired || game.winner !== null ? 'disabled' : ''}>Build Clinic</button>
              <button class="btn ${game.pendingAction === 'city' ? 'active' : ''}" onclick="G.setAction('city')" ${!game.rolled || game.moveFlareRequired || game.winner !== null ? 'disabled' : ''}>Upgrade Center</button>
              <button class="btn good" onclick="G.buyTherapy()" ${!game.rolled || game.moveFlareRequired || game.winner !== null ? 'disabled' : ''}>Buy Therapy</button>
              <button class="btn warn" onclick="G.playTherapy()" ${game.selectedCardIndex === null || game.moveFlareRequired || game.winner !== null ? 'disabled' : ''}>Play Selected Card</button>
              <button class="btn bad" onclick="G.endTurn()" ${isSetup() || game.moveFlareRequired || game.winner !== null ? 'disabled' : ''}>End Turn</button>
            </div>
          </div>

          <div class="panel">
            <div class="header"><div class="between"><strong>Current player</strong><span class="pill">${p.name}</span></div></div>
            <div class="body stack">
              <div>
                <div class="tiny" style="margin-bottom:8px">Resources</div>
                <div class="resource-grid">${renderResources(p)}</div>
              </div>
              <div class="card">
                <div class="between"><strong>Therapy hand</strong><span class="tiny">Select a card</span></div>
                <div class="stack" style="margin-top:10px">${renderHand()}</div>
                ${game.pendingAction === 'takeTwo' ? `<div class="token-grid" style="margin-top:10px">${RESOURCES.map(r => `<button class="token-btn" onclick="G.resolvePlenty('${r.key}')" style="background:${r.color}1f;border-color:${r.color}66">${r.short}</button>`).join('')}</div>` : ''}
                ${game.pendingAction === 'monopoly' ? `<div class="token-grid" style="margin-top:10px">${RESOURCES.map(r => `<button class="token-btn" onclick="G.resolveMonopoly('${r.key}')" style="background:${r.color}1f;border-color:${r.color}66">${r.short}</button>`).join('')}</div>` : ''}
              </div>
              <div class="card">
                <strong>Trade with bank (4:1)</strong>
                <div class="tiny" style="margin-top:6px">Simple trading keeps the prototype easy to learn.</div>
                <div class="stack" style="margin-top:10px">
                  <div><div class="tiny" style="margin-bottom:6px">Give 4</div><div class="token-grid">${tradeButtons('give')}</div></div>
                  <div><div class="tiny" style="margin-bottom:6px">Get 1</div><div class="token-grid">${tradeButtons('get')}</div></div>
                </div>
                <button class="btn small" style="margin-top:10px" onclick="G.doTrade()">Trade</button>
              </div>
              <div class="card">
                <strong>Selected tile</strong>
                <div class="tiny" style="margin-top:8px">${selectedTile ? (selectedTile.type === 'trigger' ? `${selectedTile.tissue}: Trigger tile. It does not produce resources.` : `${selectedTile.tissue}: ${R[selectedTile.type].desc} Activates on ${selectedTile.number}.`) : 'Click any tile to learn what it represents.'}</div>
              </div>
              <div>
                <div class="between" style="margin-bottom:8px"><strong>Event log</strong><span class="tiny">Newest first</span></div>
                <div class="log">${game.log.map(item => `<div class="log-item">${item}</div>`).join('')}</div>
              </div>
            </div>
            <div class="footer-note">Standalone browser build. You can upload this HTML file to GitHub Pages, Netlify, or Vercel for public hosting.</div>
          </div>
        </div>
        ${game.winner !== null ? `<div class="modal-wrap"><div class="modal"><div class="header between"><div><div class="title small">${game.players[game.winner].name} wins!</div><div class="subtitle">They reached ${victoryPoints(game.players[game.winner])} victory points by stabilizing the immune landscape.</div></div><button class="btn" onclick="G.restart()">Play again</button></div><div class="content"><div class="card"><div class="tiny">Main takeaway: autoimmune treatment is not simply about turning the immune system off. The most promising therapies increasingly aim to restore healthier immune control and tolerance.</div></div></div></div></div>` : ''}
        ${showRulesModal ? rulesModal() : ''}`;
    }

    window.G = {
      startGame,
      setPlayerCount(n) { startConfig.count = n; if (startConfig.names.length < n) startConfig.names = DEFAULT_NAMES.slice(0, n); render(); },
      setPlayerName(i, value) { startConfig.names[i] = value; },
      showRules() { showRulesModal = true; render(); },
      hideRules() { showRulesModal = false; render(); },
      closeRules(ev) { if (ev.target.classList.contains('modal-wrap')) { showRulesModal = false; render(); } },
      restart() { showStartModal = true; showRulesModal = false; game = null; render(); },
      rollDice,
      clickTile,
      clickVertex,
      clickEdge,
      setAction,
      buyTherapy,
      playTherapy,
      endTurn,
      doTrade,
      setTrade(type, key) { game.trade[type] = key; render(); },
      resolvePlenty,
      resolveMonopoly,
      selectCard,
    };

    render();
  })();
  </script>
</body>
</html>
